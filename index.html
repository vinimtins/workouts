/* ================= wiring ================= */
function wire(){
  /* ---- logged set rows: tap to edit, swipe to delete ---- */
  document.querySelectorAll('[data-swipe]').forEach(r=>{if(r._sw)return;r._sw=true;swipeable(r)});
  document.querySelectorAll('[data-editset]').forEach(q=>q.onclick=()=>openSheet(setSheet(q.dataset.editset)));
  const editSet=(id,f)=>{const q=S.sets.find(x=>x.id===id);if(!q)return;
    f(q);q.ts=Date.now();hap(8);save();openSheet(setSheet(id));render()};
  document.querySelectorAll('[data-esw]').forEach(q=>q.onclick=()=>{
    const v=q.dataset.esw,id=v.slice(1);
    editSet(id,r=>{const st2=weightStep(r.ex);
      r.weight=Math.max(0,+(r.weight+(v[0]==='+'?st2:-st2)).toFixed(2))})});
  document.querySelectorAll('[data-esr]').forEach(q=>q.onclick=()=>{
    const v=q.dataset.esr,id=v.slice(1);
    editSet(id,r=>{r.reps=Math.max(1,r.reps+(v[0]==='+'?1:-1))})});
  document.querySelectorAll('[data-estype]').forEach(q=>q.onclick=()=>{
    const [t,id]=q.dataset.estype.split('|');
    const r=S.sets.find(x=>x.id===id);if(!r)return;
    r.type=t;delete r.warm;r.ts=Date.now();hap(8);save();openSheet(setSheet(id));render()});
  document.querySelectorAll('[data-esrpe]').forEach(q=>q.onclick=()=>{
    const [v,id]=q.dataset.esrpe.split('|'),r=S.sets.find(x=>x.id===id);
    if(!r)return;r.rpe=(r.rpe===+v?null:+v);r.ts=Date.now();hap(8);save();openSheet(setSheet(id));render()});
  const esn=el('esnote');if(esn)esn.onblur=e=>{
    const r=S.sets.find(x=>x.id===e.target.dataset.esnote);
    if(r){r.note=e.target.value.trim();r.ts=Date.now();save();render()}};
  document.querySelectorAll('[data-esdel]').forEach(q=>q.onclick=()=>{
    const id=q.dataset.esdel,q2=S.sets.find(x=>x.id===id);
    if(q2){const blk2=S.session&&S.session.blocks.find(z=>z.ex===q2.ex);
      if(blk2&&blk2.logged>0)blk2.logged--}
    S.del=(S.del||[]).concat([{id,ts:Date.now()}]);
    S.sets=S.sets.filter(x=>x.id!==id);
    closeSheet();save();render();toast('Set removed.')});

  const b=cur();
  document.querySelectorAll('[data-step]').forEach(q=>q.onclick=()=>{const k=q.dataset.step,c=cur();if(!c)return;
    const step=weightStep(c.ex);
    if(k==='w+')c.weight=+(c.weight+step).toFixed(2);
    if(k==='w-')c.weight=Math.max(0,+(c.weight-step).toFixed(2));
    hap(8);
    if(k==='r+')c.reps++;if(k==='r-')c.reps=Math.max(1,c.reps-1);save();render()});
  const w=el('w'),r=el('r');
  if(w)w.onchange=e=>{cur().weight=Math.max(0,+e.target.value||0);save();render()};
  if(r)r.onchange=e=>{cur().reps=Math.max(1,parseInt(e.target.value)||1);save();render()};
  document.querySelectorAll('[data-qdup]').forEach(q=>q.onclick=e=>{
    e.stopPropagation();
    const i=+q.dataset.qdup, s2=S.session, src=s2.blocks[i];
    if(!src)return;
    /* A copy sits directly after the original and starts fresh, so it reads as
       "do this lift again" rather than as extra sets bolted onto the first. */
    const copy={ex:src.ex,target:src.target,reps:src.reps,weight:src.weight,
      logged:0,rest:src.rest?Object.assign({},src.rest):null,nextType:'work',pendingNote:''};
    s2.blocks.splice(i+1,0,copy);
    hap(10);save();render();
    toast(`${byId(src.ex).n} added again · ${src.target} more sets`)});
  const adj=(i,f)=>{const q=S.session.blocks[i];if(!q)return;f(q);hap(8);save();openSheet(adjustSheet(i));render()};
  document.querySelectorAll('[data-aw]').forEach(q=>q.onclick=()=>{const v=q.dataset.aw,i=+v.slice(1);
    adj(i,r=>{const st2=weightStep(r.ex);
      r.weight=Math.max(0,+(r.weight+(v[0]==='+'?st2:-st2)).toFixed(2))})});
  document.querySelectorAll('[data-ar]').forEach(q=>q.onclick=()=>{const v=q.dataset.ar,i=+v.slice(1);
    adj(i,r=>{r.reps=Math.max(1,r.reps+(v[0]==='+'?1:-1))})});
  document.querySelectorAll('[data-as]').forEach(q=>q.onclick=()=>{const v=q.dataset.as,i=+v.slice(1);
    adj(i,r=>{r.target=Math.max(Math.max(1,r.logged),r.target+(v[0]==='+'?1:-1))})});
  document.querySelectorAll('[data-arx]').forEach(q=>q.onclick=()=>{
    const v=q.dataset.arx,sign=v[0],[k,ix]=v.slice(1).split('|');
    adj(+ix,r=>{r.rest=r.rest||{};
      r.rest[k]=Math.max(15,Math.min(600,blockRest(r,k)+(sign==='+'?15:-15)))})});
  document.querySelectorAll('[data-doswap]').forEach(q=>q.onclick=()=>{
    const [ix,exId]=q.dataset.doswap.split('|'),i=+ix;
    const b2=S.session.blocks[i];
    b2.ex=exId;b2.weight=suggest(exId);b2.rest=null;
    hap(10);save();closeSheet();render();toast('Swapped for '+byId(exId).n+'.')});
  document.querySelectorAll('[data-rs]').forEach(q=>q.onclick=()=>{
    const v=q.dataset.rs,k=v.slice(1),g=sessRest();
    g[k]=Math.max(15,Math.min(600,g[k]+(v[0]==='+'?15:-15)));save();openSheet(restSheet());render()});
  document.querySelectorAll('[data-rx]').forEach(q=>q.onclick=()=>{
    const v=q.dataset.rx,k=v.slice(1),c=cur();if(!c)return;
    c.rest=c.rest||{};
    c.rest[k]=Math.max(15,Math.min(600,blockRest(c,k)+(v[0]==='+'?15:-15)));
    save();openSheet(restSheet());render()});
  document.querySelectorAll('[data-rxclear]').forEach(q=>q.onclick=()=>{
    const c=cur();if(c)c.rest=null;save();openSheet(restSheet());render()});
  document.querySelectorAll('[data-settype]').forEach(q=>q.onclick=()=>{
    const b2=cur();if(!b2)return;
    b2.nextType=q.dataset.settype;hap(6);save();openSheet(adjustSheet(S.session.idx));render()});
  document.querySelectorAll('[data-rpe]').forEach(q=>q.onclick=()=>setRPE(+q.dataset.rpe));
  const bm=el('bMain');if(bm)bm.onclick=()=>{
    const st=timerState();
    if(st.mode==='set')finishSet();

const SCHEMA=6;
/* Migrations run in order and each bumps the version, so a stored document of
   any age converges on the current shape. A document from a NEWER build is
   left alone and flagged, rather than being silently mangled. */
const MIGRATIONS={
  1:d=>{d.art=d.art||{};d.checks=d.checks||[];d.del=d.del||[]},
  2:d=>{(d.plans||[]).forEach(p=>{if(!p.rest)p.rest={set:90,ex:120}})},
  3:d=>{if(d.gear&&d.gear.st){const st=d.gear.st;
      if(st.legext===false||st.legcurl===false)st.legmachine=false;
      delete st.legext;delete st.legcurl}},
  4:d=>{(d.plans||[]).forEach(p=>{if(!p.doneDays)p.doneDays=[];
      if(p.lastIdx===undefined)p.lastIdx=null})},
  5:d=>{(d.sets||[]).forEach(q=>{if(!q.type)q.type=q.warm?'warm':'work';delete q.warm});
      d.notes=d.notes||{}},
  6:d=>{/* rpe is optional on every set; nothing to backfill */}
};
function migrate(d){
  const from=d.schema||0;
  if(from>SCHEMA){
    console.warn('stored data is from a newer version');
    toast('This data was saved by a newer version of the app. Update before making changes.','bad',9000);
    return d}
  for(let v=from+1;v<=SCHEMA;v++){try{MIGRATIONS[v]&&MIGRATIONS[v](d)}catch(e){console.warn('migration',v,e)}}
  d.schema=SCHEMA;return d}

async function bootData(){
  let saved=null;
  try{saved=await store.get()}
  catch(e){
    /* Refuse to continue with a blank slate: an empty app that then syncs
       would push the emptiness over good data. */
    document.getElementById('view').innerHTML=
      `<div class="card"><h2>Data could not be read</h2>
       <div class="small mute" style="margin:8px 0">${escd(storeError||'Unknown error')}
       Nothing has been changed or deleted. Reload to try again, or restore a backup.</div>
       <button class="btn" onclick="location.reload()">Reload</button></div>`;
    throw e}
  if(saved&&Array.isArray(saved.sets))S=Object.assign(S,migrate(saved));
  else S.schema=SCHEMA;
  (S.plans||[]).forEach(normBlocks);
  if(S.draft&&S.draft.cycle){normBlocks(S.draft);if(!S.draft.rest)S.draft.rest={set:90,ex:120}}
  if(S.session&&!S.session.blocks)S.session=null;
  if(S.session&&S.session.accum===undefined){
    S.session.accum=(Date.now()-S.session.start)/1000;S.session.runningSince=null;paused=true}
  if(!byId(S.ex||''))S.ex='bsquat';
}

(async()=>{
  if(lockMeta()){
    if(await loadCachedKey()){lockState='open';await bootData();render()}
    else{lockState='locked';render();paintLock('unlock');return}
  }else{lockState='none';await bootData();render()}
  if(S.sync&&S.sync.on){await syncPull(true);render()}
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&S.sync&&S.sync.on&&!syncBusy)syncPull(true).then(render)});
  window.addEventListener('beforeunload',()=>{if(S.sync&&S.sync.on){clearTimeout(pushTimer);syncPush(false)}});
  window.addEventListener('pagehide',()=>{flush()});
})();
</script>
</body>

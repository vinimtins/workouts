<style>
:root{--ink:#15181D;--steel:#1F242C;--steel-2:#2B323C;--line:#39414D;--chalk:#E7E4DC;
--mute:#8E97A4;--signal:#E8B923;--rest:#4B9FE1;--pad:16px;--r:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--ink);color:var(--chalk);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.47;letter-spacing:-.01em;overscroll-behavior-y:contain;
  -webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
h1,h2,h3{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:600;letter-spacing:.02em;text-transform:uppercase;margin:0}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--ink);padding:calc(12px + env(safe-area-inset-top)) var(--pad) 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:25px;letter-spacing:.12em}
.brand .sub{color:var(--mute);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-family:"Barlow Condensed",sans-serif}
main{flex:1;padding:var(--pad);display:flex;flex-direction:column;gap:14px}
.card{background:var(--steel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h2{font-size:16px;letter-spacing:.13em;color:var(--mute)}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.spread{justify-content:space-between}
.mute{color:var(--mute)}.tight{gap:6px}
.hr{height:1px;background:var(--line);margin:10px 0}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-family:"Barlow Condensed",sans-serif;display:block;margin-bottom:5px}
.tag{font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;font-family:"Barlow Condensed",sans-serif}
.pill{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:99px;background:var(--steel-2);color:var(--mute);font-family:"Barlow Condensed",sans-serif;white-space:nowrap}
.pill.on{background:var(--signal);color:var(--ink)}

/* ---- session header ---- */
.sess-grid{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:start}
.sess-grid .k{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sess-grid .v{font-size:15px;font-variant-numeric:tabular-nums}
.elapsed{font-family:"Barlow Condensed",sans-serif;font-size:31px;font-variant-numeric:tabular-nums;line-height:1}
.elapsed.held{color:var(--mute)}
.held-note{margin-top:8px;font-size:12.5px;color:var(--rest);border-left:2px solid var(--rest);padding-left:9px}
.hero.held{opacity:.55}
.hero.held .clock .t{color:var(--mute)}
.groups{text-align:right;font-family:"Barlow Condensed",sans-serif;font-size:17px;text-transform:uppercase;letter-spacing:.08em;line-height:1.25}

/* ---- exercise token row ---- */
.tokens{display:flex;gap:9px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.tokens::-webkit-scrollbar{display:none}
.tok{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);color:var(--mute);
  display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-size:15px;position:relative;background:transparent}
.tok.done{color:var(--mute);border-color:var(--steel-2)}
.tok.done::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;background:var(--mute);transform:rotate(-24deg)}
.tok.now{border-color:var(--signal);border-width:3px;color:var(--chalk);font-weight:700;box-shadow:0 0 0 3px rgba(232,185,35,.14)}

/* ---- calendar day strip ---- */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;padding:0}
.day .wd{font-family:"Barlow Condensed",sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.day .c{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);color:var(--mute);
  display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-size:14px;position:relative}
.day.trained .c{color:var(--chalk);border-color:var(--steel-2);background:var(--steel-2)}
.day.trained .c::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:2px;background:var(--signal);transform:rotate(-24deg)}
.day.today .c{border-color:var(--signal);border-width:3px;color:var(--chalk);font-weight:700;box-shadow:0 0 0 3px rgba(232,185,35,.14)}
.day.today .wd{color:var(--signal)}
.day.rest-day .c{border-style:dashed}

/* ---- start actions ---- */
.acts{display:flex;flex-direction:column;gap:9px}
.act{display:block;width:100%;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--ink)}
.act:active{border-color:var(--signal)}
.act.off{opacity:.42}
.act .an{display:block;font-family:"Barlow Condensed",sans-serif;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.act .ad{display:block;font-size:14px;color:var(--mute);margin-top:2px}
#acont:not(.off){border-color:var(--rest);background:rgba(75,159,225,.09)}
#acont:not(.off) .an{color:var(--rest)}
.parked{border-left:3px solid var(--rest);padding:2px 0 2px 11px}

/* ---- exercise figures ---- */
.exfig{display:block;width:100%;height:auto}
.mm-base{fill:#333B47}
.mm-off{fill:#454E5C}
.mm-sec{fill:#8E4038}
.mm-pri{fill:#D8453B}
.figbox{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;place-items:center}
.thumb{flex:0 0 52px;height:58px;background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px;display:grid;place-items:center;overflow:hidden}
.mtag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-family:"Barlow Condensed",sans-serif;
  padding:3px 8px;border-radius:99px;white-space:nowrap}
.mtag.pri{background:#D8453B;color:#fff}
.mtag.sec{background:#6E3630;color:#E7C9C6}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.excard{background:var(--steel);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:block;width:100%}
.excard:active{border-color:var(--signal)}
.excard .fw{background:var(--ink);border-radius:7px;padding:6px 0;margin-bottom:8px}
.excard .nm{font-family:"Barlow Condensed",sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.04em;line-height:1.15}
.excard .mt{font-size:11px;color:var(--mute);margin-top:3px}
.exdesc{font-size:15px;color:var(--chalk);opacity:.9;margin-top:10px}
.attrib{font-size:11px;color:var(--mute);text-align:center;font-style:italic}
.dots{display:flex;gap:5px;margin-top:12px}
.dot2{flex:1;height:3px;border-radius:99px;background:var(--line)}
.dot2.done{background:var(--mute)}
.dot2.now{background:var(--signal)}
.delta{font-family:"Barlow Condensed",sans-serif;font-size:14px;font-variant-numeric:tabular-nums;
  min-width:44px;text-align:right;color:var(--mute)}
.delta.up{color:var(--signal)}
.delta.down{color:var(--rest)}
.dlg{position:fixed;inset:0;z-index:70;display:none}
.dlg.open{display:block}
.dlg .scrim{position:absolute;inset:0;background:rgba(8,10,13,.72)}
.dbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 40px);
  max-width:380px;background:var(--steel);border:1px solid var(--line);border-radius:14px;
  padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.dbox h3{font-family:"Barlow Condensed",sans-serif;font-size:19px;letter-spacing:.06em;
  text-transform:uppercase;margin:0 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;max-width:440px;width:calc(100% - 32px);
  background:var(--steel-2);border:1px solid var(--line);border-left:3px solid var(--signal);
  border-radius:9px;padding:12px 14px;font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{border-left-color:var(--rest)}
.lockwrap{min-height:70vh;display:grid;place-items:center;padding:20px 0}
.lockbox{width:100%;max-width:330px}
.lockmark{font-family:"Barlow Condensed",sans-serif;font-size:34px;letter-spacing:.22em;
  text-transform:uppercase;margin:0;text-align:left}
textarea.search{resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.4}
.tick{flex:0 0 24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;
  font-size:14px;color:var(--ink);background:var(--ink)}
.tick.on{background:var(--signal);border-color:var(--signal)}
.sbox{flex:0 0 54px;height:44px;background:var(--ink);border:1px solid var(--line);border-radius:7px;
  display:grid;place-items:center;padding:3px}
.sicon{width:100%;height:100%;display:block}
.sicon .i1{fill:#6C7683}
.sicon .i2{fill:#49525F}
.sicon .i3{fill:#8E97A4}
.sicon .i4{fill:#E8B923}
.sicon .i3s{fill:none;stroke:#8E97A4;stroke-width:3;stroke-linecap:round}
.sicon .i4o{fill:none;stroke:#E8B923;stroke-width:2.6;stroke-linecap:round}
.sicon .ln{stroke:#8E97A4;stroke-width:1.2;fill:none}
.item.stn{align-items:center}
.item.stn.off .sbox{opacity:.34}
.item.stn.off .body{opacity:.5}
.cyc{display:flex;gap:7px}
.cd{flex:1;text-align:center;padding:12px 0;min-height:44px;border:1px solid var(--line);border-radius:8px;
  font-family:"Barlow Condensed",sans-serif;font-size:15px;letter-spacing:.1em;color:var(--mute);
  position:relative;background:var(--ink)}
.cd.now::after{content:"";position:absolute;left:50%;bottom:5px;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--signal)}
.cd.sel{background:var(--steel-2);color:var(--chalk);border-color:var(--mute)}
.cd.sel.now{border-color:var(--signal)}
.cd.rest{border-style:dashed}
.cd.now{background:var(--signal);border-color:var(--signal);color:var(--ink);font-weight:700}
.figbox img.exfig{max-height:230px;object-fit:contain;background:#fff;border-radius:6px}
.thumb img.exfig,.excard img.exfig{background:#fff;border-radius:5px;object-fit:contain}
.thumb img.exfig{max-height:50px}
.excard img.exfig{max-height:96px}

/* ---- animated exercise scenes ---- */
.scene{display:block;width:100%;height:auto}
.scene .lab{font-family:"Barlow Condensed",sans-serif;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;fill:#D8453B}
.scene .lab2{font-family:-apple-system,system-ui,sans-serif;font-size:7.5px;fill:#98A1AE}
.scene .lead{stroke:#98A1AE;stroke-width:.7;fill:none}
.scene .sk{fill:#57616F}
.scene .sk2{fill:#49525F}
.scene .far{fill:#333B47}
.scene .pri{fill:#D8453B}
.scene .sec{fill:#9A4239}
.scene .sep{stroke:#3E4653;stroke-width:.8;fill:none}
/* two-bone arm: upper arm swings +122, forearm counter-rotates -112 so the
   forearm stays within 10 degrees of vertical, as it does under a real bar */
.scene .ua{transform-origin:146px 113px;animation:ua var(--dur,4s) cubic-bezier(.42,0,.58,1) infinite}
.scene .fa{transform-origin:146px 89px;animation:fa var(--dur,4s) cubic-bezier(.42,0,.58,1) infinite}
.scene .pec{transform-origin:161px 114px;animation:pec var(--dur,4s) cubic-bezier(.42,0,.58,1) infinite}
.scene .tri{animation:tri var(--dur,4s) cubic-bezier(.42,0,.58,1) infinite}
@keyframes ua{0%,9%{transform:rotate(0deg)}47%,56%{transform:rotate(122deg)}94%,100%{transform:rotate(0deg)}}
@keyframes fa{0%,9%{transform:rotate(0deg)}47%,56%{transform:rotate(-112deg)}94%,100%{transform:rotate(0deg)}}
@keyframes pec{0%,9%{transform:scale(.93,.90);opacity:1}47%,56%{transform:scale(1.06,1.10);opacity:.82}94%,100%{transform:scale(.93,.90);opacity:1}}
@keyframes tri{0%,9%{opacity:1}47%,56%{opacity:.6}94%,100%{opacity:1}}
.scene.paused .ua,.scene.paused .fa,.scene.paused .pec,.scene.paused .tri{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.scene .ua,.scene .fa,.scene .pec,.scene .tri{animation:none}}
.scene .flyL{transform-origin:150px 60px;animation:flyL var(--dur,4.4s) cubic-bezier(.42,0,.58,1) infinite}
.scene .flyR{transform-origin:150px 60px;animation:flyR var(--dur,4.4s) cubic-bezier(.42,0,.58,1) infinite}
.scene .pdfa{transform-origin:132px 106px;animation:pdfa var(--dur,3.4s) cubic-bezier(.42,0,.58,1) infinite}
.scene .ohfa{transform-origin:129px 61px;animation:ohfa var(--dur,3.8s) cubic-bezier(.42,0,.58,1) infinite}
@keyframes flyL{0%,9%{transform:rotate(0deg)}47%,56%{transform:rotate(-127deg)}94%,100%{transform:rotate(0deg)}}
@keyframes flyR{0%,9%{transform:rotate(0deg)}47%,56%{transform:rotate(127deg)}94%,100%{transform:rotate(0deg)}}
@keyframes pdfa{0%,10%{transform:rotate(0deg)}48%,58%{transform:rotate(-90deg)}92%,100%{transform:rotate(0deg)}}
@keyframes ohfa{0%,10%{transform:rotate(0deg)}48%,58%{transform:rotate(144deg)}92%,100%{transform:rotate(0deg)}}
/* incline shares the two-bone rig but has its own pivots and angles */
.sc-inc .ua{transform-origin:150px 110px;animation-name:uaInc}
.sc-inc .fa{transform-origin:150px 86px;animation-name:faInc}
.sc-inc .pec{transform-origin:162px 106px}
@keyframes uaInc{0%,9%{transform:rotate(0deg)}47%,56%{transform:rotate(117deg)}94%,100%{transform:rotate(0deg)}}
@keyframes faInc{0%,9%{transform:rotate(0deg)}47%,56%{transform:rotate(-126deg)}94%,100%{transform:rotate(0deg)}}
.scene.paused .flyL,.scene.paused .flyR,.scene.paused .pdfa,.scene.paused .ohfa{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.scene .flyL,.scene .flyR,.scene .pdfa,.scene .ohfa{animation:none}}


/* ---- timer hero ---- */
.hero{background:var(--steel);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;position:relative;overflow:hidden}
.hero.resting{border-color:var(--rest)}
.hero .ring{position:absolute;left:0;top:0;height:3px;background:var(--rest);transition:width .95s linear}
.hero .exname{font-family:"Barlow Condensed",sans-serif;font-size:clamp(20px,5.6vw,24px);text-transform:uppercase;letter-spacing:.05em;line-height:1.1}
.clock{display:flex;align-items:center;gap:14px;margin:14px 0 4px}
.clock .t{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:clamp(52px,17vw,68px);line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clock.rest .t{color:var(--rest)}
.clock .side{flex:1;text-align:right}
.clock .side .big{font-family:"Barlow Condensed",sans-serif;font-size:27px;font-variant-numeric:tabular-nums;line-height:1.1}

.search{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 13px;font-size:16px}
input:focus{outline:2px solid var(--signal);outline-offset:-2px}

/* ---- bar ---- */
.bar{display:flex;align-items:center;justify-content:center;height:52px;gap:1px}
.sleeve{height:6px;background:linear-gradient(#B9BEC7,#7C838E);flex:0 0 22px;border-radius:2px}
.knurl{height:10px;background:repeating-linear-gradient(90deg,#9AA1AC 0 2px,#6E757F 2px 4px);flex:0 0 30px;border-radius:2px}
.plate{width:11px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.bar-cap{font-family:"Barlow Condensed",sans-serif;font-size:11px;color:var(--mute);text-align:center;letter-spacing:.1em;text-transform:uppercase}

/* ---- lists ---- */
.item{display:flex;align-items:center;gap:11px;width:100%;padding:13px 0;min-height:52px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .body .t{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .arw{color:var(--mute);font-size:17px}
.dot{flex:0 0 8px;height:8px;border-radius:50%;background:var(--line)}

.x{margin-left:auto;color:var(--mute);padding:11px 12px;font-size:19px;line-height:1;min-width:44px;text-align:center}
.empty{color:var(--mute);font-size:14px;padding:8px 0}
.seg{display:flex;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;text-align:center;padding:12px 4px;min-height:44px;border-radius:6px;font-family:"Barlow Condensed",sans-serif;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--steel-2);color:var(--chalk)}

.chip{flex:0 0 auto;padding:11px 14px;min-height:44px;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;font-size:12.5px;color:var(--mute);white-space:nowrap}

  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--steel);
 border:1px solid var(--line);border-radius:14px 14px 0 0;overflow-y:auto;padding:16px var(--pad) calc(24px + env(safe-area-inset-bottom));
 animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}

.spark{width:100%;height:52px;display:block}

nav{position:fixed;bottom:0;left:0;right:0;z-index:35;background:var(--steel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}

/* ---- player: session header ---- */
.sess-hdr{display:flex;gap:13px;align-items:center;padding:2px 4px 14px}

  font-family:"Barlow Condensed",sans-serif;font-size:14px}

  padding:10px 4px;min-height:44px;flex:0 0 auto}

.now .prog{position:absolute;left:0;top:0;height:3px;background:var(--rest);transition:width .95s linear}
.now .art{width:110px;height:96px;float:right;margin:-2px -2px 6px 12px;background:#fff;
  border-radius:14px;display:grid;place-items:center;overflow:hidden}
.now .art svg,.now .art img{width:100%;height:100%;object-fit:contain}
.now .track{font-family:"Barlow Condensed",sans-serif;font-size:clamp(21px,6vw,26px);
  text-transform:uppercase;letter-spacing:.03em;line-height:1.05;margin-bottom:2px}
.now .sub{font-size:12.5px;color:var(--mute)}
.now .stats{display:flex;gap:20px;margin-top:13px;clear:both}
.now .stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:22px;line-height:1.1}
.now .stat i{font-style:normal;font-size:14px;color:var(--mute)}
.now .stat span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);
  font-family:"Barlow Condensed",sans-serif}

/* ---- player: timer with inline adjust ---- */
.timer{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 2px}

  display:grid;place-items:center;font-size:23px;line-height:1;flex:0 0 46px;background:transparent}

.big{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:clamp(54px,17vw,66px);

.big.rest{color:var(--rest)}
.big.paused{color:var(--mute)}

  letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:26px}

/* ---- player: transport ---- */
.transport{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tbtn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;

/* tappable name and artwork in the player */
.now .track.tapname{display:block;width:100%;text-align:left;padding:0;background:none;

  border:1px solid var(--mute);color:var(--mute);font-family:-apple-system,system-ui,serif;

.flexb{flex:1}

/* iOS-native easing: things enter decisively and settle, never bounce */

<script>
/* ================= storage ================= */
const KEY='rack:v3';
let storeError=null;
/* ================= passphrase lock =================
   Everything in storage is encrypted with AES-GCM under a key derived from a
   passphrase via PBKDF2. What this does and does not protect:

     protects  - someone reading the raw storage of a device (backups, disk
                 images, another app, a cleared-but-recoverable browser store)
     protects  - the sync token, which is inside the encrypted blob
     does NOT  - stop someone using an already-unlocked device, since staying
                 unlocked means the key is cached on that device

   Choosing "stay unlocked" is a deliberate trade of some security for not
   typing a passphrase every session. Lock now clears the cached key.        */
const LOCK_KEY='rack:lock:v1';       /* {salt, verifier, iv} */
const CACHE_KEY='rack:lockcache:v1'; /* cached raw key, present while unlocked */
let CK=null;                          /* CryptoKey in memory */
let lockState='none';                 /* none | locked | open */

const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
/* Collision-safe ids. randomUUID exists everywhere current; the fallback is
   still 122 bits of entropy rather than Math.random(). */
const uid=()=>{
  try{if(crypto.randomUUID)return crypto.randomUUID()}catch(e){}
  const b=crypto.getRandomValues(new Uint8Array(16));
  b[6]=(b[6]&0x0f)|0x40;b[8]=(b[8]&0x3f)|0x80;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`};
const toB64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function deriveKey(pass,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}

async function encJSON(obj){
  const iv=rnd(12);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},CK,
    new TextEncoder().encode(JSON.stringify(obj)));
  return {v:1,iv:toB64(iv),d:toB64(ct)}}
async function decJSON(box){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(box.iv)},CK,fromB64(box.d));
  return JSON.parse(new TextDecoder().decode(pt))}

const lockMeta=()=>{try{return JSON.parse(localStorage.getItem(LOCK_KEY))}
  catch(e){console.warn('lock metadata unreadable',e);return null}};
async function cacheKey(){try{
  const raw=await crypto.subtle.exportKey('raw',CK);
  localStorage.setItem(CACHE_KEY,toB64(raw))}
  catch(e){console.warn('key cache failed',e);toast('Could not stay unlocked on this device.','bad')}}
async function loadCachedKey(){
  const c=localStorage.getItem(CACHE_KEY);if(!c)return false;
  try{CK=await crypto.subtle.importKey('raw',fromB64(c),{name:'AES-GCM'},true,['encrypt','decrypt']);
    return true}catch(e){console.warn('cached key unusable',e);return false}}
function forgetKey(){CK=null;localStorage.removeItem(CACHE_KEY);lockState='locked'}

async function setPassphrase(pass){
  const salt=rnd(16);
  CK=await deriveKey(pass,salt);
  const iv=rnd(12);
  const ver=await crypto.subtle.encrypt({name:'AES-GCM',iv},CK,new TextEncoder().encode('rack-ok'));
  localStorage.setItem(LOCK_KEY,JSON.stringify({salt:toB64(salt),iv:toB64(iv),verifier:toB64(ver)}));
  await cacheKey();lockState='open';await save()}

async function tryUnlock(pass){
  const m=lockMeta();if(!m)return false;
  try{
    const k=await deriveKey(pass,fromB64(m.salt));
    const out=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(m.iv)},k,fromB64(m.verifier));
    if(new TextDecoder().decode(out)!=='rack-ok')return false;
    CK=k;await cacheKey();lockState='open';return true
  }catch(e){return false}}

async function changePassphrase(oldp,newp){
  if(!await tryUnlock(oldp))return false;
  const data=Object.assign({},S);
  await setPassphrase(newp);
  Object.assign(S,data);await save();return true}

async function removeLock(pass){
  if(!await tryUnlock(pass))return false;
  const data=Object.assign({},S);
  localStorage.removeItem(LOCK_KEY);localStorage.removeItem(CACHE_KEY);
  CK=null;lockState='none';S=data;await save();return true}

/* ---- the gate shown before the app renders ---- */
function lockScreen(mode,err){
  const set=mode==='set';
  return `<div class="lockwrap"><div class="lockbox">

function paintLock(mode,err){
  document.body.classList.add('locked');
  el('view').innerHTML=lockScreen(mode,err);
  document.querySelector('header').style.display='none';
  document.querySelector('nav').style.display='none';
  const go=async()=>{
    const p=el('lkpass').value;
    if(!p){paintLock(mode,'Enter something.');return}
    if(mode==='set'){
      if(p.length<6){paintLock(mode,'Use at least six characters.');return}
      if(p!==el('lkpass2').value){paintLock(mode,'The two entries do not match.');return}
      await setPassphrase(p);unpaintLock();render();
    }else{
      if(await tryUnlock(p)){await bootData();unpaintLock();render()}
      else paintLock(mode,'That passphrase does not match.')}};
  el('lkgo').onclick=go;
  el('lkpass').onkeydown=e=>{if(e.key==='Enter')go()};
  const p2=el('lkpass2');if(p2)p2.onkeydown=e=>{if(e.key==='Enter')go()};
  const f=el('lkforget');if(f)f.onclick=async()=>{
    const r=await dialog({title:'No recovery',
      body:'There is no way to recover the passphrase. Clearing the lock erases the data stored on '+
           'this device. If sync is set up, you can reconnect on another device and pull it back. '+
           'Type ERASE to confirm.',
      fields:[{label:'Type ERASE'}],confirmText:'Erase this device',danger:true});
    if(!r||String(r[0]).trim().toUpperCase()!=='ERASE')return;
    localStorage.removeItem(LOCK_KEY);localStorage.removeItem(CACHE_KEY);
    localStorage.removeItem(KEY);location.reload()};
  el('lkpass').focus()}
function unpaintLock(){
  document.body.classList.remove('locked');
  document.querySelector('header').style.display='';

 async get(){try{
   let raw;
   if(window.storage){const r=await window.storage.get(KEY);raw=r?r.value:null}
   else raw=localStorage.getItem(KEY);
   if(!raw)return null;
   const o=JSON.parse(raw);
   if(o&&o.v===1&&o.d){
     if(!CK)return null;                       /* locked, not an error */
     try{return await decJSON(o)}
     catch(e){
       /* wrong key or corrupted blob: never silently start from empty */
       console.error('decrypt failed',e);
       storeError='Your saved data could not be decrypted on this device.';
       throw e}}
   return o;
 }catch(e){

 async set(v){
   const body=CK?JSON.stringify(await encJSON(v)):JSON.stringify(v);

   try{localStorage.setItem(KEY,body)}

/* ================= muscle map figures =================
   Optional real artwork: drop a URL or data-URI into IMG and it overrides the
   generated figure everywhere. Leave a key out and the muscle map is used.
   e.g. IMG.preacher = 'https://example.com/preacher-curl.png'                */
/* Artwork lives beside index.html in an img/ folder, not inlined: base64 costs
   a third more, bloats every code update, and cannot be cached separately.
   Any file present here overrides the generated muscle map everywhere.     */
const IMG_DIR='img/';
const IMG_FILES={
  legext:'leg-extension.gif'
  /* add more as you drop files in, e.g. legcurl:'leg-curl.gif' */
};
const IMG={};
Object.keys(IMG_FILES).forEach(k=>{IMG[k]=IMG_DIR+IMG_FILES[k]});
/* ================= artwork layer =================
   Priority when drawing an exercise: saved artwork -> hardcoded IMG -> animated
   SCENE -> generated muscle map. Artwork is fetched from wger.de, whose exercise
   data is CC-BY-SA, so an attribution line is shown wherever an image is used.
   The wger JSON API may refuse cross-origin browser requests; if it does, the
   manual URL field below works regardless, because <img> loads are not subject
   to CORS.                                                                    */
const WGER='https://wger.de';
let artBusy=false,artLog=null;

const art=id=>(S.art&&S.art[id])||null;
function setArt(id,rec){S.art=S.art||{};if(rec)S.art[id]=rec;else delete S.art[id];touch('art');save()}

async function wgerLookup(name){
  const url=`${WGER}/api/v2/exercise/search/?term=${encodeURIComponent(name)}&language=english&format=json`;
  const r=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!r.ok)throw new Error('wger returned '+r.status);
  const j=await r.json();
  const hit=(j.suggestions||[]).map(s=>s.data).find(d=>d&&d.image);
  if(!hit)return null;
  const abs=p=>p.startsWith('http')?p:WGER+p;
  return {url:abs(hit.image),thumb:hit.image_thumbnail?abs(hit.image_thumbnail):abs(hit.image),
    matched:hit.name||name,src:'wger'};
}

async function fetchArtFor(id,quiet){
  try{
    const rec=await wgerLookup(byId(id).n);
    if(rec){setArt(id,rec);return 'ok'}
    return 'none';
  }catch(e){if(!quiet)artLog={err:String(e.message||e)};return 'fail'}
}

async function fetchAllArt(){
  if(artBusy)return;artBusy=true;artLog={done:0,ok:0,none:0,fail:0,total:EX.length,err:null};render();
  for(const x of EX){
    if(art(x.id)){artLog.done++;artLog.ok++;continue}
    let res;
    try{res=await fetchArtFor(x.id,true)}catch(e){res='fail'}
    if(res==='fail'&&artLog.fail===0){
      try{await fetch(WGER+'/api/v2/exercise/search/?term=test&format=json')}
      catch(e){artLog.err='blocked'}
      if(!artLog.err)artLog.err='other';
    }
    artLog[res==='ok'?'ok':res==='none'?'none':'fail']++;artLog.done++;
    if(artLog.done%4===0)render();
    await new Promise(r=>setTimeout(r,250));
  }
  artBusy=false;save();render();
}

function artSheet(){
  const have=EX.filter(x=>art(x.id)).length;
  const l=artLog;
  return `<div class="row spread"><h2 style="font-size:22px;color:var(--chalk)">Exercise artwork</h2>
   <button class="pill" data-close>Close</button></div>
  <div class="small mute" style="margin:10px 0">Pulls illustrations from wger.de, an open fitness database.
   Its images are Creative Commons Attribution Share-Alike, so an attribution line appears wherever one is used.
   Anything without a match keeps the muscle map.</div>
  <div class="row spread"><span class="lbl" style="margin:0">Coverage</span>
    <span class="pill ${have?'on':''}">${have} of ${EX.length}</span></div>
  <div class="meter" style="margin:8px 0 14px"><i style="width:${have/EX.length*100}%"></i></div>
  ${l&&l.total?`<div class="small" style="margin-bottom:12px">
    ${artBusy?`Fetching… ${l.done} of ${l.total}`:`Finished. ${l.ok} matched, ${l.none} with no image, ${l.fail} failed.`}
    ${l.err==='blocked'?`<div class="held-note" style="margin-top:8px">wger refused the request from the browser.
      This is a cross-origin restriction on their API and cannot be fixed from this app.
      Use the per-exercise image field instead, which works for any image URL.</div>`:''}
    ${l.err==='other'?`<div class="held-note" style="margin-top:8px">The request failed. Check your connection and try again.</div>`:''}
  </div>`:''}
  <button class="btn" id="artall" ${artBusy?'disabled style="opacity:.5"':''}>${artBusy?'Fetching…':'Fetch artwork for all exercises'}</button>
  ${have?`<div style="height:9px"></div><button class="btn ghost" id="artclear">Remove all artwork</button>`:''}
  <div class="hr"></div>
  <div class="lbl">Per exercise</div>
  <div class="small mute">Open any exercise and use the image field there to paste your own photo or URL.
   That route always works, including offline if you paste a data URI.</div>`}

function artBlock(id){
  const a=art(id);
  return `<div class="hr"></div><div class="lbl">Image</div>
  ${a?`<div class="small mute" style="margin-bottom:8px">Showing artwork${a.matched?` matched as “${esc(a.matched)}”`:''}.</div>`:''}
  <input class="search" id="arturl" placeholder="Paste an image URL" value="${a?esc(a.url):''}">
  <div class="row" style="margin-top:9px;gap:8px">
    <button class="btn slim" data-artget="${id}" style="flex:1">Find on wger</button>
    <button class="btn ghost slim" data-artset="${id}" style="flex:1">Use this URL</button>
    ${a?`<button class="btn ghost slim" data-artdel="${id}">Clear</button>`:''}
  </div>`}

function attribution(id){
  const a=art(id);if(!a)return '';
  if(a.src!=='wger')return '<div class="attrib">Your own image</div>';
  return `<div class="attrib">Illustration from wger.de, licensed CC-BY-SA</div>`}

/* Swipe left on a row to reveal a delete action. Uses pointer events so it
   works with touch and trackpad, and yields to vertical scrolling.        */
function swipeable(el2,onDelete){
  let x0=0,y0=0,dx=0,active=false,locked=null;
  const surface=el2.querySelector('.swipe-face')||el2;
  el2.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    x0=e.clientX;y0=e.clientY;dx=0;active=true;locked=null;
    surface.style.transition='none'},{passive:true});
  el2.addEventListener('pointermove',e=>{
    if(!active)return;
    const mx=e.clientX-x0,my=e.clientY-y0;
    if(locked===null){
      if(Math.abs(my)>10&&Math.abs(my)>Math.abs(mx)){locked='y';active=false;return}
      if(Math.abs(mx)>10)locked='x'}
    if(locked!=='x')return;
    dx=Math.max(-96,Math.min(0,mx));
    surface.style.transform=`translateX(${dx}px)`},{passive:true});
  const end=()=>{
    if(!active)return;active=false;
    surface.style.transition='transform .18s ease';
    if(dx<-58){surface.style.transform='translateX(-96px)';el2.classList.add('swiped')}
    else{surface.style.transform='';el2.classList.remove('swiped')}};
  el2.addEventListener('pointerup',end);
  el2.addEventListener('pointercancel',end);
  el2.addEventListener('pointerleave',end)}

/* One dialog primitive replaces prompt(), confirm() and alert(). Those block
   the main thread, cannot be styled, and on iOS steal focus in a way that
   loses the keyboard mid-session. This returns a promise instead.          */
function dialog({title,body,fields,confirmText,danger}){
  return new Promise(resolve=>{
    const d=el('dlg');
    el('dbody').innerHTML=
      `<h3>${escd(title||'')}</h3>`+
      (body?`<div class="small mute" style="margin-bottom:12px">${escd(body)}</div>`:'')+
      (fields||[]).map((f,i)=>
        `<div style="margin-bottom:10px"><span class="lbl">${escd(f.label)}</span>
         <input class="search" id="dfld${i}" type="${f.type||'text'}"
           placeholder="${escd(f.placeholder||'')}" value="${escd(f.value||'')}"
           autocapitalize="off" autocorrect="off" spellcheck="false"></div>`).join('')+
      `<div class="row tight" style="margin-top:14px">
         <button class="btn ghost flexb" id="dno">Cancel</button>
         <button class="btn flexb ${danger?'danger':''}" id="dyes">${escd(confirmText||'OK')}</button>
       </div>`;
    d.classList.add('open');document.body.classList.add('locked');
    const first=el('dfld0');if(first)setTimeout(()=>first.focus(),30);
    const close=v=>{d.classList.remove('open');document.body.classList.remove('locked');
      el('dbody').innerHTML='';document.removeEventListener('keydown',onKey);resolve(v)};
    const submit=()=>{
      if(!fields||!fields.length)return close(true);
      close((fields||[]).map((f,i)=>(el('dfld'+i)||{}).value||''))};
    const onKey=e=>{if(e.key==='Escape')close(null);if(e.key==='Enter')submit()};
    document.addEventListener('keydown',onKey);
    el('dyes').onclick=submit;
    el('dno').onclick=()=>close(null);
    d.querySelector('[data-dcancel]').onclick=()=>close(null)})}

/* ---- serialised persistence ----------------------------------------------
   store.set is async: it encrypts, then writes. Called concurrently, two
   writes can interleave and the later-started one can land first, persisting
   stale state. Every write therefore goes through a single promise chain, and
   a pending write is collapsed rather than queued because only the newest
   snapshot matters.                                                        */
let writeChain=Promise.resolve(), writePending=false, writeFailed=null;
function save(){
  S.mtime=Date.now();
  if(writePending)return writeChain;           /* newest state will be picked up */
  writePending=true;
  writeChain=writeChain.then(async()=>{
    writePending=false;
    try{
      await store.set(S);
      if(writeFailed){writeFailed=null;toast('Saved.')}
    }catch(e){
      writeFailed=e;
      toast('Could not save: '+(e&&e.message||e)+'. Export a backup.','bad',8000);
      throw e;
    }
  }).catch(()=>{});                             /* keep the chain alive */
  if(typeof schedulePush==='function')schedulePush();
  return writeChain}

const LB_PER_KG=2.2046226218;

  if(v==null||!isFinite(v))return null;

  /* Always one decimal, trailing zero stripped. A 100 lb threshold looked
     tidier but lost real precision: 62.5 kg is 137.8 lb, and rounding that
     to 138 reads back as 62.6 kg. */
  return +(Math.round(x*10)/10)}

/* The smallest total jump you can make: two of your smallest plate for a bar,
   your dumbbell increment otherwise. Stepping by a fixed 2.5 was wrong for
   both a 1.25 kg plate pair and a 5 kg dumbbell jump.                      */
function weightStep(exId){
  const g=G(),x=exId&&byId(exId);
  if(x&&x.eq==='Dumbbell')return (g.db&&g.db.step)||2.5;
  if(x&&x.bar){const sz=plateSizes();return sz.length?Math.min(...sz)*2:2.5}
  return 2.5}
const plateSizes=()=>Object.keys(G().plates).filter(k=>G().plates[k]>0).map(Number).sort((a,b)=>b-a);
const haveStation=k=>{const g=G();return !g.set||g.st[k]!==false};
const haveEx=id=>exStations(id).every(haveStation);
const missingFor=id=>exStations(id).filter(k=>!haveStation(k))
  .map(k=>(STATIONS.find(s=>s[0]===k)||[,k])[1]);

/* ---- plate maths against the inventory you actually own ---- */
function loadout(total){
  const g=G(),bar=+g.bar||0;
  let side=(total-bar)/2;
  if(side<-1e-9)return {under:true,bar};
  const out=[],used={};
  for(const sz of plateSizes()){
    const perSide=Math.floor((g.plates[String(sz)]||0)/2);
    while(side>=sz-1e-9&&(used[sz]||0)<perSide){out.push(sz);used[sz]=(used[sz]||0)+1;side=+(side-sz).toFixed(3)}
  }
  return {plates:out,left:+side.toFixed(2),bar}}
function barSVG(total){
  const g=G(),L=loadout(total);
  if(L.under)return `<div class="bar-cap">Below bar weight (${g.bar} ${g.unit})</div>`;
  if(!plateSizes().length)return `<div class="bar-cap">No plates set up · Plan › Gear</div>`;
  const h=sz=>Math.max(17,Math.min(50,18+Math.sqrt(sz)*6.5));
  const pl=a=>a.map(sz=>`<div class="plate" style="height:${h(sz)}px;background:${PCOL[String(sz)]||'#7A828E'}"></div>`).join('');
  const note=L.left>0?`${L.left} ${g.unit} short, closest you can load`
    :(L.plates.length?L.plates.join(' + ')+' per side':'empty bar');
  const tot=S.dualUnit?` · ${conv(total,g.unit,other(g.unit))} ${other(g.unit)} total`:'';
  return `<div class="bar"><div class="sleeve"></div>${pl(L.plates.slice().reverse())}<div class="knurl"></div>${pl(L.plates)}<div class="sleeve"></div></div>
    <div class="bar-cap">${esc(note)}${tot}</div>`}

/* ================= history ================= */
/* the most recent day this lift was trained, excluding today */
const exNote=id=>(S.notes&&S.notes[id])||'';
function setExNote(id,v){S.notes=S.notes||{};
  if(v&&v.trim())S.notes[id]=v.trim();else delete S.notes[id];touch('notes');save()}
function lastSessionFor(id){
  const days=[...new Set(S.sets.filter(q=>q.ex===id&&q.date!==today()).map(q=>q.date))].sort();
  if(!days.length)return null;
  const d=days[days.length-1];
  return {d,sets:S.sets.filter(q=>q.ex===id&&q.date===d)}}
function bestEver(id){const a=S.sets.filter(s=>s.ex===id&&stype(s).vol);return a.length?a.reduce((b,s)=>e1rm(s)>e1rm(b)?s:b):null}
function lastWorking(id){const a=S.sets.filter(s=>s.ex===id);return a.length?a[a.length-1]:null}
function byDay(id){const m={};S.sets.filter(s=>s.ex===id).forEach(s=>m[s.date]=(m[s.date]||0)+s.weight*s.reps);
 return Object.entries(m).sort().map(([d,v])=>({d,v}))}
function rel(d){const n=Math.round((new Date(today())-new Date(d))/864e5);return n===0?'today':n===1?'yesterday':n+' days ago'}
function trainedDays(){return new Set(S.sets.map(s=>s.date))}
function dayStrip(n){
  n=n||21;const set=trainedDays(),out=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);
    const k=d.toISOString().slice(0,10),did=set.has(k);
    out.push(`<button class="day ${did?'trained':'rest-day'} ${i===0?'today':''}" data-day="${k}"
      aria-label="${d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}${did?', trained':''}">
      <span class="wd">${d.toLocaleDateString(undefined,{weekday:'narrow'})}</span>
      <span class="c">${d.getDate()}</span></button>`)}
  return `<div class="days" id="daystrip">${out.join('')}</div>`}
function streak(){const set=trainedDays();let n=0;const d=new Date();d.setHours(12,0,0,0);
  if(!set.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);
  while(set.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function last7(){const set=trainedDays();let n=0;const d=new Date();d.setHours(12,0,0,0);
  for(let i=0;i<7;i++){if(set.has(d.toISOString().slice(0,10)))n++;d.setDate(d.getDate()-1)}return n}
function suggest(id){const b=lastWorking(id);if(b)return b.weight;const x=byId(id);return x.eq==='Bodyweight'?0:(x.bar?40:10)}

/* ================= session ================= */
/* ================= monthly plans =================
   A plan is a rolling cycle of days. Day index comes from how many days have
   passed since the start date, so the cycle keeps turning regardless of what
   weekday it is. Set counts ramp week by week rather than being fixed.       */
/* a block is {ex, reps, hi, sets}. sets null means follow the weekly ramp.
   reps and hi give a range; when equal it renders as a single number.       */
const blk=(ex,reps,hi,sets)=>({ex,reps,hi:hi||reps,sets:sets||null});
function normBlocks(p){
  p.cycle.forEach(d=>d.b=d.b.map(b=>Array.isArray(b)?blk(b[0],b[1],b[1],b[2]):
    (b.hi?b:blk(b.ex,b.reps,b.reps,b.sets))));return p}

/* ---- timers -------------------------------------------------------------
   Timing is derived from wall-clock stamps held in S.session, never from a
   counter incremented by setInterval: a backgrounded tab stops firing
   intervals, so counting silently loses time. The stamps live in the session
   so they also survive a reload.                                          */
function stopTick(){clearInterval(tick);tick=null}
function tnow(){return Date.now()}

let wakeLock=null;
async function keepAwake(on){
  try{
    if(on){ if(wakeLock)return;
      if(!('wakeLock' in navigator))return;
      wakeLock=await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release',()=>{wakeLock=null}) }
    else if(wakeLock){await wakeLock.release();wakeLock=null}
  }catch(e){wakeLock=null;console.warn('wake lock',e)}}

function timerState(){
  const s=S.session;if(!s||!s.tm)return {mode:'idle',t:0,total:0};
  const m=s.tm;
  const gone=m.paused?m.held:((tnow()-m.since)/1000+m.held);
  if(m.mode==='set')return {mode:'set',t:gone,total:0};
  const left=m.total-gone;
  if(m.paused)return {mode:'rest',t:Math.max(0,left),total:m.total};
  return {mode:left<=0?'done':'rest',t:Math.max(0,left),total:m.total}}

function armTimer(mode,total){
  const s=S.session;if(!s)return;
  s.tm={mode,since:tnow(),held:0,total:total||0,paused:false,fired:false};
  stopTick();tick=setInterval(tickPaint,250)}
function clearTimer(){const s=S.session;if(s)s.tm=null;stopTick()}
function pauseTimer(){const s=S.session,m=s&&s.tm;if(!m||m.paused)return;
  m.held+=(tnow()-m.since)/1000;m.paused=true;stopTick();save()}
function resumeTimer(){const s=S.session,m=s&&s.tm;if(!m||!m.paused)return;
  m.since=tnow();m.paused=false;stopTick();tick=setInterval(tickPaint,250);save()}

function sessRest(){
  const s=S.session;if(!s)return {set:90,ex:120};
  if(!s.rest){const p=findWk(s.wk);
    s.rest={set:(p&&p.rest&&p.rest.set)||90,ex:(p&&p.rest&&p.rest.ex)||120}}
  return s.rest}
function blockRest(b,between){
  const g=sessRest();
  if(b&&b.rest&&b.rest[between]!=null)return b.rest[between];
  return between==='ex'?g.ex:g.set}
const restFor=(exId,between)=>{
  const b=S.session&&S.session.blocks.find(q=>q.ex===exId);
  return blockRest(b,between)};

function beginSet(){hap(10);armTimer('set',0);save();render()}
function finishSet(){
  const s=S.session,b=cur();if(!b)return;
  const st=timerState();
  hap([10,40,18]);   /* logging a set is the app's success moment */
  const ty=b.nextType||'work';
  S.sets.push({id:uid(),date:today(),ex:b.ex,reps:b.reps,type:ty,
    weight:b.weight,dur:Math.round(st.t),ts:tnow(),note:b.pendingNote||'',
    rpe:b.nextRPE||null});
  b.pendingNote='';b.nextRPE=null;
  s.lastLog=`${b.weight?wt(b.weight)+' × ':''}${b.reps}`;
  if(SETTYPE[ty].counts)b.logged++;
  const wasDrop=ty==='drop';
  b.nextType='work';
  const doneHere=b.logged>=b.target;
  const anyLeft=s.blocks.some(q=>q.logged<q.target);
  if(doneHere&&anyLeft)advance();
  if(!anyLeft)clearTimer();
  else if(wasDrop)armTimer('set',0);
  else armTimer('rest',restFor(b.ex,doneHere?'ex':'set'));
  save();render()}
function stopTimer(){clearTimer();save();render()}

/* The bar targets whichever set the rating can sensibly belong to: while a set
   is running it is held and attached when the set is logged; once the set is
   logged it edits that set directly. */
function rpeTarget(){
  const s=S.session;if(!s)return null;
  const b=cur();if(!b)return null;
  if(timerState().mode==='set')return {pending:true,b};
  const mine=S.sets.filter(q=>q.date===today()&&q.ex===b.ex);
  return mine.length?{set:mine[mine.length-1]}:{pending:true,b}}
function currentRPE(){
  const t=rpeTarget();if(!t)return null;
  return t.pending?(t.b.nextRPE||null):(t.set.rpe||null)}
function setRPE(v){
  const t=rpeTarget();if(!t)return;
  if(t.pending)t.b.nextRPE=(t.b.nextRPE===v?null:v);
  else {t.set.rpe=(t.set.rpe===v?null:v);t.set.ts=Date.now()}
  hap(10);save();render()}
function bumpRest(sec){
  const s=S.session,m=s&&s.tm;if(!m||m.mode!=='rest')return;
  m.total=Math.max(5,m.total+sec);
  if(m.fired&&m.total>((m.paused?m.held:(tnow()-m.since)/1000+m.held)))m.fired=false;
  hap(6);save();render()}

function tickPaint(){
  /* the 250 ms path only touches text nodes; it must never call render() */
  const st=timerState();
  const c=el('clockval');if(c)c.textContent=mmss(st.t);
  const r=el('ring');if(r&&st.total)r.style.width=(st.t/st.total*100)+'%';
  const e=el('elapsed');if(e&&S.session)e.textContent=hhmm(sessionElapsed());
  const s=S.session,m=s&&s.tm;
  if(m&&m.mode==='rest'&&!m.fired&&st.mode==='done'){
    m.fired=true;
    if(navigator.vibrate)navigator.vibrate([140,90,140]);
    notifyRestOver();
    if(S.autoNext!==false){armTimer('set',0);save();render()}
    else render()}}

function notifyRestOver(){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const b=cur();
    new Notification('Rest over',{body:b?`${byId(b.ex).n} · set ${Math.min(b.logged+1,b.target)} of ${b.target}`:'Next set',
      tag:'rack-rest',renotify:true})
  }catch(e){console.warn('notification failed',e)}}
async function askNotify(){
  try{if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission()}
  catch(e){console.warn('notification permission',e)}}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  const s=S.session,m=s&&s.tm;
  if(m&&!m.paused){stopTick();tick=setInterval(tickPaint,250);tickPaint()}
  if(!document.hidden&&S.session&&!wakeLock)keepAwake(true);
  if(s)render()});

function paintElapsed(){const e=el('elapsed');if(e&&S.session)e.textContent=hhmm(sessionElapsed())}
clearInterval(elapsedTick);elapsedTick=setInterval(paintElapsed,1000);

/* ---- session lifecycle ------------------------------------------------- */
function cur(){return S.session?S.session.blocks[S.session.idx]:null}
function sessionGroups(){if(!S.session)return '';
  return [...new Set(S.session.blocks.map(b=>byId(b.ex).g))].join('<br>')}
/* Move to the next lift in the order the session was written. It only ever
   moves FORWARD: silently jumping backwards to a lift left a set short is
   disorienting mid-workout, and doing fewer sets than planned is a normal
   decision rather than an error to be corrected. Anything skipped is still
   visible in the token row and reachable by tapping it. */
function advance(){const s=S.session;
  const next=s.blocks.findIndex((b,i)=>i>s.idx&&b.logged<b.target);
  if(next>-1){s.idx=next;return}
  /* nothing incomplete ahead: sit on the last lift rather than wrapping */
  const lastIncomplete=s.blocks.reduce((a,b,i)=>b.logged<b.target?i:a,-1);
  s.idx=lastIncomplete>s.idx?lastIncomplete:s.blocks.length-1}

const sessionRunning=()=>!!(S.session&&S.session.runningSince);
function sessionElapsed(){const s=S.session;if(!s)return 0;
  return s.accum+(s.runningSince?(Date.now()-s.runningSince)/1000:0)}
function pauseSession(){const s=S.session;if(!s||!s.runningSince)return;
  s.accum+=(Date.now()-s.runningSince)/1000;s.runningSince=null;
  if(s.tm&&!s.tm.paused)pauseTimer();
  paused=true;save();render()}
function resumeSession(){const s=S.session;if(!s||s.runningSince)return;
  s.runningSince=Date.now();paused=false;
  if(s.tm&&s.tm.paused)resumeTimer();
  save();render()}

function startPlanDay(p,i){
  const d=p.cycle[i];
  S.session={wk:p.id,dayIdx:i,name:`${d.k} · ${d.n}`,start:Date.now(),accum:0,
    runningSince:Date.now(),idx:0,
    rest:{set:(p.rest&&p.rest.set)||90,ex:(p.rest&&p.rest.ex)||120},
    blocks:d.b.map(b=>({ex:b.ex,target:blkSets(p,b),reps:b.hi,logged:0,weight:suggest(b.ex)}))};
  S.parked=null;paused=false;save();askNotify();keepAwake(true);tab='workout';closeSheet();render()}

function startFreestyle(){
  S.session={wk:null,name:'Freestyle',start:Date.now(),accum:0,runningSince:Date.now(),idx:0,
    rest:{set:90,ex:120},blocks:[]};
  S.parked=null;paused=false;save();askNotify();keepAwake(true);
  tab='workout';closeSheet();render()}

function parkSession(){const s=S.session;if(!s)return;
  if(s.runningSince){s.accum+=(Date.now()-s.runningSince)/1000;s.runningSince=null}
  S.parked=s;S.session=null;stopTick();keepAwake(false);save();tab='workout';render()}
function resumeParked(){if(!S.parked)return;
  S.session=S.parked;S.parked=null;paused=true;save();keepAwake(true);tab='workout';render()}

const plans=()=>S.plans||[];
const curPlan=()=>plans().find(p=>p.id===S.current)||plans()[0]||null;
const findWk=id=>plans().find(p=>p.id===id);
function planDay(p,d){
  /* Which day of the cycle comes next is driven by what has actually been
     completed, not by how many calendar days have elapsed. Skipping two days
     should not skip two training days.                                      */
  const n=Math.floor((new Date(d||today())-new Date(p.start))/864e5);
  const doneCount=(p.doneDays||[]).length;
  let i;
  if(p.pinned!=null)i=p.pinned;
  else if(doneCount)i=(p.lastIdx+1)%p.cycle.length;
  else i=0;
  /* if the next slot is a rest day and one was already taken today, move on */
  const wk=Math.max(1,Math.min(p.weeks,Math.floor(doneCount/Math.max(1,sessionsPerWeek(p)))+1));
  return {i,week:wk,day:n+1,done:doneCount,total:plannedSessions(p),
    past:doneCount>=plannedSessions(p)}}
const restDays=p=>p.cycle.filter(c=>!c.b.length).length;
const sessionsPerWeek=p=>Math.max(1,Math.round(7/p.cycle.length*(p.cycle.length-restDays(p))));
const plannedSessions=p=>p.weeks*sessionsPerWeek(p);
function markDayDone(p,i){
  planView=null;
  p.doneDays=(p.doneDays||[]).concat([{i,d:today(),ts:Date.now()}]);
  p.lastIdx=i;p.pinned=null;save()}
const weekSets=p=>{const w=planDay(p).week;return p.prog[Math.min(w,p.prog.length)-1]||3};
const blkSets=(p,b)=>b.sets||weekSets(p);
const daySets=(p,i)=>p.cycle[i].b.reduce((a,b)=>a+blkSets(p,b),0);
const planDur=(p,i)=>Math.round(daySets(p,i)*2);
const repTxt=b=>b.hi>30?b.reps+'s':(b.reps===b.hi?b.reps+' reps':b.reps+'\u2013'+b.hi+' reps');
const planSets=weekSets;

function startPlanDay(p,i){
  const d=p.cycle[i];
  S.session={wk:p.id,dayIdx:i,name:`${d.k} · ${d.n}`,start:Date.now(),accum:0,runningSince:Date.now(),idx:0,
    rest:{set:(p.rest&&p.rest.set)||90,ex:(p.rest&&p.rest.ex)||120},
    blocks:d.b.map(b=>({ex:b.ex,target:blkSets(p,b),reps:b.hi,logged:0,weight:suggest(b.ex)}))};
  S.parked=null;paused=false;save();askNotify();keepAwake(true);tab='workout';closeSheet();render()}

function sameNode(a,b){
  if(a.nodeType!==b.nodeType)return false;
  if(a.nodeType===1){
    if(a.tagName!==b.tagName)return false;
    /* an explicit key is authoritative; ids are treated as keys too */
    const ka=a.getAttribute('data-k')||a.id, kb=b.getAttribute('data-k')||b.id;
    if(ka||kb)return ka===kb;
    return true}
  return true}

function morphAttrs(from,to){
  const fa=from.attributes,ta=to.attributes;
  for(let i=ta.length-1;i>=0;i--){
    const {name,value}=ta[i];
    if(from.getAttribute(name)!==value)from.setAttribute(name,value)}
  for(let i=fa.length-1;i>=0;i--){
    const name=fa[i].name;
    if(!to.hasAttribute(name))from.removeAttribute(name)}
  /* attributes do not cover live form state */
  if(from.tagName==='INPUT'||from.tagName==='TEXTAREA'){
    const active=document.activeElement===from;
    if(!active&&to.hasAttribute('value')&&from.value!==to.getAttribute('value'))
      from.value=to.getAttribute('value');
    if(from.type==='checkbox'||from.type==='radio')from.checked=to.hasAttribute('checked')}
  if(from.tagName==='SELECT'&&document.activeElement!==from&&to.hasAttribute('value'))
    from.value=to.getAttribute('value')}

function morph(from,to){
  if(!sameNode(from,to)){from.replaceWith(to.cloneNode(true));return}
  if(from.nodeType===3||from.nodeType===8){
    if(from.nodeValue!==to.nodeValue)from.nodeValue=to.nodeValue;
    return}
  if(from.nodeType!==1)return;
  morphAttrs(from,to);
  /* leave a focused text field's contents entirely alone */
  if(document.activeElement===from&&(from.tagName==='INPUT'||from.tagName==='TEXTAREA'))return;

  const fc=[...from.childNodes], tc=[...to.childNodes];
  /* match keyed children by key so reordering does not rebuild them */
  const keyed={};
  fc.forEach(n=>{if(n.nodeType===1){const k=n.getAttribute('data-k')||n.id;if(k)keyed[k]=n}});
  let fi=0;
  tc.forEach(tn=>{
    const k=tn.nodeType===1?(tn.getAttribute('data-k')||tn.id):null;
    if(k&&keyed[k]){
      const match=keyed[k];
      if(fc[fi]!==match)from.insertBefore(match,fc[fi]||null);
      morph(match,tn);
      delete keyed[k];
      fi=[...from.childNodes].indexOf(match)+1;
      return}
    const cand=from.childNodes[fi];
    if(cand&&sameNode(cand,tn)){morph(cand,tn);fi++;return}
    from.insertBefore(tn.cloneNode(true),cand||null);fi++});
  while(from.childNodes.length>fi)from.removeChild(from.childNodes[fi]);
}

const _parser=document.createElement('div');
function paint(host,html){
  _parser.innerHTML=html;
  /* morph child by child so the host element itself is untouched */
  const fc=[...host.childNodes], tc=[...(_parser.childNodes)];
  let i=0;
  tc.forEach(tn=>{
    const cand=host.childNodes[i];
    if(cand&&sameNode(cand,tn)){morph(cand,tn);i++;return}
    host.insertBefore(tn.cloneNode(true),cand||null);i++});
  while(host.childNodes.length>i)host.removeChild(host.childNodes[i]);
  _parser.innerHTML='';
}

const VIEWS={workout:vWorkout,plan:vPlan,bio:vBio,stat:vStat,build:vBuild,settings:vSettings};
let renderQueued=false;
function render(){
  if(renderQueued)return;
  renderQueued=true;
  requestAnimationFrame(()=>{renderQueued=false;renderNow()})}
function renderNow(){
  const ds=el('datesub');
  if(ds)ds.textContent=new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));
  const host=el('view');
  const scroll=window.scrollY;
  paint(host,(VIEWS[tab]||vWorkout)());
  wire();paintElapsed();
  /* morphing preserves layout, so the browser should not have moved us */
  if(Math.abs(window.scrollY-scroll)>4)window.scrollTo(0,scroll);
}

const QI={
 rest:'<path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 10.6V6h-2v7.4l5 3 1-1.7z"/>',
 dup:'<path d="M15 1H4a2 2 0 00-2 2v12h2V3h11zm4 4H8a2 2 0 00-2 2v14a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2zm0 16H8V7h11z"/>',

 swap:'<path d="M7 7h9l-2.5-2.5L15 3l5 5-5 5-1.5-1.5L16 9H7zM17 17H8l2.5 2.5L9 21l-5-5 5-5 1.5 1.5L8 15h9z"/>'
};
function restItem(what,secs){
  return `<div class="qrow rest-row"><div class="qdot">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">${QI.rest}</svg></div>
    <div class="qbody"><div class="a">Rest</div><div class="b">${esc(what)}</div></div>
    <div class="qtime num">${mmss(secs)}</div></div>`}
function liftItem(q,i,detail){
  const x=byId(q.ex);
  return `<div class="qrow" data-k="q-${i}-${q.ex}">
    <div class="qart">${figure(q.ex,'front')}</div>
    <div class="qbody"><div class="a">${esc(x.n)}</div><div class="b">${esc(detail)}</div></div>
    <div class="qacts">
      <button data-qdup="${i}" aria-label="Duplicate"><svg viewBox="0 0 24 24">${QI.dup}</svg></button>
      <button data-qcfg="${i}" aria-label="Adjust"><svg viewBox="0 0 24 24">${QI.gear}</svg></button>
      <button data-qdel="${i}" aria-label="Remove"><svg viewBox="0 0 24 24">${QI.trash}</svg></button>
      <button data-qswap="${i}" aria-label="Swap"><svg viewBox="0 0 24 24">${QI.swap}</svg></button>
    </div></div>`}
function queueRows(s){
  const out=[],b=s.blocks[s.idx];
  for(let n=b.logged+1;n<b.target;n++){
    out.push(restItem('Between sets',blockRest(b,'set')));
    out.push(liftItem(b,s.idx,`Set ${n+1} of ${b.target} · ${wt(b.weight)} · ${b.reps} reps`));
  }
  for(let i=s.idx+1;i<s.blocks.length;i++){
    const q=s.blocks[i];
    if(q.logged>=q.target)continue;
    out.push(restItem('Moving to the next lift',blockRest(b,'ex')));
    out.push(liftItem(q,i,`${q.target-q.logged} sets · ${q.reps} reps${q.weight?' · '+wt(q.weight):''}`));
  }
  return out.join('')||'<div class="empty" style="padding:8px 4px">Nothing left in the queue.</div>'}

/* skip every remaining set of the current lift and land on the next one */

  const s=S.session;if(!s)return;

  s.idx=next;clearTimer();hap(8);save();render()}

/* ---- BIO ---- */
/* ================= body check-in =================
   Deliberately narrow. Anything a watch or smart scale already measures is left
   out, because duplicating it means two records that drift apart. What remains
   is what no device can read: a tape measure, and body weight.               */
const MEAS=[
 ['waist','Waist','At the navel, standing relaxed, after a normal exhale'],
 ['neck','Neck','Just below the Adam\u2019s apple, tape level'],
 ['chest','Chest','Around the widest point, arms hanging relaxed'],
 ['hips','Hips','Around the widest point of the glutes'],
 ['armL','Left arm','Mid-bicep. Flexed or relaxed, but pick one and keep it'],
 ['armR','Right arm','Same position and state as the left'],
 ['thighL','Left thigh','Halfway between hip crease and knee'],
 ['thighR','Right thigh','Same height as the left'],
 ['calfL','Left calf','At the widest point'],
 ['calfR','Right calf','Same as the left'],
 ['bf','Body fat','Optional. Whatever method you use, stay with the same one']
];
const CHECK_DAYS=90;
/* ================= data import and backup =================
   Renpho exports CSV from Trends. Column names vary by app version and locale,
   so nothing is hardcoded: headers are matched against synonyms, everything is
   previewed before it is written, and unmatched columns are reported rather
   than silently dropped.                                                     */
const IMPORT_MAP={
 date:['time','date','measured','timestamp','datetime','measurement time','日期','时间'],
 weight:['weight','body weight','bodyweight','mass','peso'],
 bf:['body fat','bodyfat','fat percentage','fat %','fat(%)','body fat rate','fat'],
 neck:['neck','collar'],
 chest:['chest','bust','torso'],
 waist:['waist','abdomen','belly'],
 hips:['hip','hips','buttocks','glutes'],
 armL:['left arm','left upper arm','left bicep','left biceps','l arm','arm left'],
 armR:['right arm','right upper arm','right bicep','right biceps','r arm','arm right'],
 thighL:['left thigh','left leg','l thigh','thigh left'],
 thighR:['right thigh','right leg','r thigh','thigh right'],
 calfL:['left calf','l calf','calf left'],
 calfR:['right calf','r calf','calf right']
};
let imp=null;   /* {rows, cols, unit, wunit, text, unmatched} */

function parseCSV(text){
  const t=text.replace(/\r\n?/g,'\n').trim();
  if(!t)return {headers:[],rows:[]};
  const delim=[',',';','\t'].map(d=>({d,n:(t.split('\n')[0].split(d).length)}))
    .sort((a,b)=>b.n-a.n)[0].d;
  const line=l=>{const out=[];let cur='',q=false;
    for(let i=0;i<l.length;i++){const c=l[i];
      if(q){if(c==='"'&&l[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}
      else if(c==='"')q=true;else if(c===delim){out.push(cur.trim());cur=''}else cur+=c}
    out.push(cur.trim());return out};
  const all=t.split('\n').filter(l=>l.trim()).map(line);
  return {headers:all[0].map(h=>h.replace(/^\ufeff/,'')),rows:all.slice(1),delim}}

function detectCols(headers){
  const cols={},used=new Set();
  headers.forEach((h,i)=>{
    const clean=h.toLowerCase().replace(/\(.*?\)/g,'').replace(/[_\-]/g,' ').trim();
    for(const [field,syn] of Object.entries(IMPORT_MAP)){
      if(cols[field]!==undefined)continue;
      if(syn.some(x=>clean===x)||syn.some(x=>clean.startsWith(x+' ')||clean.endsWith(' '+x))){
        cols[field]=i;used.add(i);return}}
  });
  /* second, looser pass for anything still unclaimed */
  headers.forEach((h,i)=>{if(used.has(i))return;
    const clean=h.toLowerCase();
    for(const [field,syn] of Object.entries(IMPORT_MAP)){
      if(cols[field]!==undefined)continue;
      if(syn.some(x=>clean.includes(x))){cols[field]=i;used.add(i);return}}});
  const unmatched=headers.filter((h,i)=>!used.has(i)&&h);
  return {cols,unmatched}}

function parseDate(v,order){
  if(!v)return null;
  const s=String(v).trim().split(/[ T]/)[0];
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
  if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);
  if(m){const a=+m[1],b=+m[2];
    const day=order==='mdy'?b:a, mon=order==='mdy'?a:b;
    return `${m[3]}-${String(mon).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
  const d=new Date(v);return isNaN(d)?null:d.toISOString().slice(0,10)}

/* 03/04 is ambiguous; a value above 12 in either slot settles it */
function detectOrder(rows,di){
  let dmy=false,mdy=false;
  rows.forEach(r=>{const m=String(r[di]||'').trim().split(/[ T]/)[0]
    .match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.]\d{4}$/);
    if(!m)return; if(+m[1]>12)dmy=true; if(+m[2]>12)mdy=true});
  return mdy&&!dmy?'mdy':dmy&&!mdy?'dmy':null}

function impRows(){
  if(!imp)return [];
  const {cols}=imp,out=[];
  imp.rows.forEach(r=>{
    const d=parseDate(r[cols.date],imp.dorder);if(!d)return;
    const rec={d,vals:{},weight:null};
    Object.entries(cols).forEach(([f,i])=>{
      if(f==='date')return;
      const raw=String(r[i]||'').replace(',','.').replace(/[^\d.\-]/g,'');
      const v=parseFloat(raw);if(!isFinite(v)||v<=0)return;
      if(f==='weight')rec.weight=imp.wunit==='lb'?+(v*0.45359237).toFixed(1):+v.toFixed(1);
      else rec.vals[f]=f==='bf'?+v.toFixed(1):(imp.unit==='in'?+(v*2.54).toFixed(1):+v.toFixed(1));
    });
    if(rec.weight!=null||Object.keys(rec.vals).length)out.push(rec)});
  /* one record per day, latest wins */
  const byDay={};out.forEach(r=>byDay[r.d]=r);
  return Object.values(byDay).sort((a,b)=>a.d<b.d?-1:1)}

function doImport(){
  const rows=impRows();let w=0,c=0;
  rows.forEach(r=>{
    if(r.weight!=null){S.bio=S.bio.filter(x=>x.d!==r.d);S.bio.push({d:r.d,v:r.weight,ts:Date.now()});w++}
    if(Object.keys(r.vals).length){
      const ex=(S.checks||[]).find(x=>x.d===r.d);
      if(ex)Object.assign(ex.vals,r.vals);
      else (S.checks=S.checks||[]).push({d:r.d,vals:r.vals,ts:Date.now()});
      c++}});
  imp=null;save();closeSheet();render();
  toast(`Imported ${w} weight entries and ${c} measurement sets.`)}

function importSheet(){
  const rows=imp?impRows():[];
  const matched=imp?Object.keys(imp.cols).filter(k=>k!=='date'):[];
  const label=f=>(MEAS.find(m=>m[0]===f)||[,f==='weight'?'Body weight':f])[1];
  return `<div class="row spread"><h2 style="font-size:21px;color:var(--chalk)">Import from Renpho</h2>
    <button class="pill" data-close>Close</button></div>
  <div class="small mute" style="margin:10px 0">In the Renpho app: Trends, then Circumference or Weight, then the export icon.
    Save the CSV, then either choose the file below or paste its contents.</div>

/* ================= GitHub sync =================
   One JSON file in a private repo, written through the GitHub contents API.
   Every save is a commit, so the repo doubles as a full timestamped history.

   Merge strategy, since two devices can both be ahead:
     sets / bio / checks -> merged item by item, newest timestamp wins,
                            with tombstones so a deletion is not resurrected
     plans / gear / art  -> taken wholesale from whichever document was
                            saved more recently, since config rarely differs  */
const SYNC_DEFAULT={token:'',repo:'',path:'workouts.json',branch:'main',sha:null,
  lastPull:null,lastPush:null,on:false};
const SY=()=>{if(!S.sync)S.sync=Object.assign({},SYNC_DEFAULT);return S.sync};
let syncBusy=false,syncErr=null,pushTimer=null,syncNote='';

const b64enc=str=>{const b=new TextEncoder().encode(str);let s='';
  for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
  return btoa(s)};
const b64dec=str=>new TextDecoder().decode(
  Uint8Array.from(atob(String(str).replace(/\s/g,'')),c=>c.charCodeAt(0)));

async function ghFetch(method,body){
  const y=SY();
  if(!y.token||!y.repo)throw new Error('Sync is not set up');
  const url=`https://api.github.com/repos/${y.repo}/contents/${y.path}`+
    (method==='GET'?`?ref=${encodeURIComponent(y.branch)}&t=${Date.now()}`:'');
  const r=await fetch(url,{method,
    headers:{'Authorization':'Bearer '+y.token,'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},
    ...(body?{body:JSON.stringify(body)}:{})});
  if(r.status===404&&method==='GET')return null;
  if(!r.ok){
    let m=r.status+'';try{const j=await r.json();m=j.message||m}catch(e){}
    if(r.status===401)m='Token rejected. Check it was copied whole.';
    if(r.status===403)m='Access refused. Check the token can write Contents on this repo.';
    if(r.status===404)m='Repo or path not found. Check the owner/name is exact.';
    throw new Error(m)}
  return r.json()}

/* ---- what counts as one item, and how items are keyed ---- */
const SYNC_LISTS=[['sets','id'],['bio','d'],['checks','d']];
function mergeDoc(local,remote){
  if(!remote)return {out:local,changed:false};
  const out=Object.assign({},local);
  const lm=local.mtime||0, rm=remote.mtime||0;
  let changed=false;

  /* tombstones from both sides */
  const del={};[...(local.del||[]),...(remote.del||[])].forEach(t=>{
    if(!del[t.id]||del[t.id]<t.ts)del[t.id]=t.ts});
  out.del=Object.entries(del).map(([id,ts])=>({id,ts}))
    .filter(t=>Date.now()-t.ts<90*864e5);

  SYNC_LISTS.forEach(([key,idf])=>{
    const map={};
    (local[key]||[]).forEach(x=>map[x[idf]]=x);
    (remote[key]||[]).forEach(x=>{
      const k=x[idf],cur=map[k];
      if(!cur){map[k]=x;changed=true}
      else if((x.ts||rm)>(cur.ts||lm)){map[k]=x;changed=true}});
    let arr=Object.values(map).filter(x=>{
      const t=del[x[idf]];return !(t&&t>=(x.ts||0))});
    arr.sort((a,b)=>String(a[idf]).localeCompare(String(b[idf])));
    if(key==='sets')arr.sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:0));
    out[key]=arr});

  /* Configuration merges per field on its own stamp, so editing gear on one
     device and a plan on the other no longer loses whichever synced second. */
  const lf=local.fmtime||{}, rf=remote.fmtime||{};
  out.fmtime=Object.assign({},lf);
  ['plans','current','gear','art','height','autoNext','notes','done'].forEach(k=>{
    const lt=lf[k]||lm, rt=rf[k]||rm;
    if(rt>lt&&(k in remote)){out[k]=remote[k];out.fmtime[k]=rt;changed=true}
    else if(k in local)out.fmtime[k]=lt});
  /* a live session belongs to the device holding it; never merged */
  ['session','parked'].forEach(k=>{if(local[k]!=null)out[k]=local[k];
    else if(rm>lm&&remote[k]!=null)out[k]=remote[k]});
  out.mtime=Math.max(lm,rm);
  return {out,changed}}
/* stamp a field whenever it is deliberately changed */
function touch(k){S.fmtime=S.fmtime||{};S.fmtime[k]=Date.now()}

async function syncPull(quiet){
  const y=SY();syncBusy=true;syncErr=null;if(!quiet)render();
  try{
    const res=await ghFetch('GET');
    if(!res){syncNote='Nothing saved in the repo yet.';y.sha=null}
    else{
      y.sha=res.sha;
      const remote=migrate(JSON.parse(b64dec(res.content)));
      const {out,changed}=mergeDoc(S,remote);
      Object.assign(S,out);
      if(!S.art)S.art={};if(!S.checks)S.checks=[];(S.plans||[]).forEach(normBlocks);
      syncNote=changed?'Pulled changes from the repo.':'Already up to date.';
    }
    y.lastPull=Date.now();await save();
  }catch(e){syncErr=e.message;toast('Sync could not read the repo: '+e.message,'bad',7000)}
  syncBusy=false;if(!quiet)render();
}

async function syncPush(retry){
  const y=SY();if(!y.on||!y.token||!y.repo)return;
  await flush();   /* never push a state that has not finished being written */
  syncBusy=true;syncErr=null;
  try{
    S.mtime=Date.now();
    const payload=Object.assign({},S);delete payload.sync;
    const res=await ghFetch('PUT',{
      message:`workout data ${new Date().toISOString().slice(0,16).replace('T',' ')}`,
      content:b64enc(JSON.stringify(payload)),branch:y.branch,...(y.sha?{sha:y.sha}:{})});
    y.sha=res.content.sha;y.lastPush=Date.now();syncNote='Saved to the repo.';
    await save();
  }catch(e){
    /* someone else wrote first: pull, merge, try once more */
    if(!retry&&/sha|conflict|409|422/i.test(e.message)){
      syncBusy=false;await syncPull(true);return syncPush(true)}
    syncErr=e.message}
  syncBusy=false;
  const b=el('syncline');if(b)b.textContent=syncLine();
}
function schedulePush(){
  const y=S.sync;if(!y||!y.on)return;
  clearTimeout(pushTimer);pushTimer=setTimeout(()=>syncPush(false),4000)}

const ago=t=>{if(!t)return 'never';const s=(Date.now()-t)/1000;
  return s<60?'just now':s<3600?Math.round(s/60)+' min ago':
    s<86400?Math.round(s/3600)+' h ago':Math.round(s/86400)+' d ago'};
const syncLine=()=>{const y=SY();
  return syncBusy?'Syncing…':syncErr?('Problem: '+syncErr):
    y.on?`Last saved ${ago(y.lastPush)} · pulled ${ago(y.lastPull)}`:'Not connected'};

/* ---- whole-app backup ---- */
function exportBackup(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`rack-backup-${today()}.json`;

  setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function restoreBackup(text){
  try{
    const o=JSON.parse(text);
    if(!o||typeof o!=='object'||!('sets' in o))throw new Error('not a Rack backup');
    S=Object.assign({},S,o);
    if(!S.art)S.art={};if(!S.checks)S.checks=[];(S.plans||[]).forEach(normBlocks);
    save();render();toast('Backup restored.')
  }catch(e){toast('Could not read that file: '+e.message,'bad',6000)}}

let chk=null;   /* {i, vals} while a check-in is in progress */

const checks=()=>(S.checks||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
const lastCheck=()=>{const c=checks();return c.length?c[c.length-1]:null};
function daysSinceCheck(){const l=lastCheck();if(!l)return null;
  return Math.round((new Date(today())-new Date(l.d))/864e5)}

function startCheck(){
  const l=lastCheck();
  chk={i:0,vals:Object.assign({},l?l.vals:{})};
  openSheet(checkSheet())}
function saveCheck(){
  const vals={};Object.keys(chk.vals).forEach(k=>{if(chk.vals[k])vals[k]=+chk.vals[k]});
  S.checks=(S.checks||[]).filter(c=>c.d!==today());
  S.checks.push({d:today(),vals,ts:Date.now()});chk=null;save();closeSheet();render()}

function checkSheet(){
  const [key,name,hint]=MEAS[chk.i];
  const prev=lastCheck(), pv=prev&&prev.vals[key];
  const v=chk.vals[key]||'';

  return `<div class="row spread"><h2 style="font-size:20px;color:var(--chalk)">Check-in</h2>
    <button class="pill" id="chkquit">Cancel</button></div>
  <div class="dots">${MEAS.map((m,i)=>`<span class="dot2 ${i<chk.i?'done':''} ${i===chk.i?'now':''}"></span>`).join('')}</div>
  <div class="lbl" style="margin-top:14px">Step ${chk.i+1} of ${MEAS.length}</div>
  <div style="font-family:'Barlow Condensed',sans-serif;font-size:27px;text-transform:uppercase;letter-spacing:.05em">${esc(name)}</div>
  <div class="small mute" style="margin:4px 0 14px">${esc(hint)}</div>
  <div class="stepper" style="max-width:260px">
    <button data-chk="-">−</button>
    <input id="chkval" type="number" inputmode="decimal" step="${step}" value="${v}" placeholder="${pv||'—'}">
    <button data-chk="+">+</button></div>
  <div class="small mute" style="margin-top:8px">
    ${pv?`Last time ${pv} ${unit}${v&&+v!==pv?` · ${(+v-pv>0?'+':'')+(+v-pv).toFixed(1)} ${unit}`:''}`:`No previous reading. Units are ${unit}.`}</div>
  <div class="row" style="margin-top:18px;gap:8px">
    <button class="btn ghost slim" id="chkback" ${chk.i?'':'style="opacity:.4"'} style="flex:1">Back</button>
    <button class="btn ghost slim" id="chkskip" style="flex:1">Skip</button>
    <button class="btn slim" id="chknext" style="flex:2">${chk.i===MEAS.length-1?'Save check-in':'Next'}</button>
  </div>`}

function deltaRow(key,name,cur,prev,unit){
  if(cur==null)return '';
  const d=prev==null?null:+(cur-prev).toFixed(1);
  const cls=d===null?'':d>0?'up':d<0?'down':'';
  return `<div class="item"><span class="body"><span class="t">${esc(name)}</span></span>
    <span class="num" style="font-size:16px">${cur} ${unit}</span>
    ${d===null?'<span class="pill">new</span>'
     :`<span class="delta ${cls}">${d>0?'+':''}${d}</span>`}</div>`}

function vBio(){
  const b=S.bio.slice().sort((a,c)=>a.d<c.d?-1:1), last=b[b.length-1];
  const c=checks(), cur=c[c.length-1], prev=c[c.length-2];
  const since=daysSinceCheck(), due=since===null||since>=CHECK_DAYS;
  return `
  <div class="card">
    <div class="row spread"><h2>Body weight</h2>
      ${last?`<span class="pill">${rel(last.d)}</span>`:''}</div>
    <div style="height:10px"></div>

        <div class="stat"><b class="num">${b.length}</b><span>entries</span></div></div>`
    :'<div class="empty small">Log twice and the trend line appears.</div>'}
  </div>

  <div class="card">

    <div class="small mute" style="margin:8px 0 12px">

    <button class="btn ${due?'':'ghost'}" id="newcheck">${cur?'New check-in':'Take first measurements'}</button>

  </div>

    <h2>From Renpho</h2>

  </div>

  <div class="card"><h2>Relative strength</h2><div style="height:6px"></div>
  ${last?relStrength(last.v):'<div class="empty">Log a body weight to see your lifts as a multiple of it.</div>'}</div>

  ${c.length>1?`<div class="card"><h2>Past check-ins</h2><div style="height:4px"></div>

  ${b.length?b.slice().reverse().slice(0,12).map(e=>`<div class="item"><span class="body">

    <span class="num">${e.v} kg</span><button class="x" data-delbio="${e.d}" aria-label="Remove">×</button></div>`).join('')
  :'<div class="empty">Nothing logged yet.</div>'}</div>`}

function relStrength(bw){
  const key=['bsquat','bench','dead','ohp'].map(id=>({x:byId(id),b:bestEver(id)})).filter(o=>o.b);
  if(!key.length)return '<div class="empty">Log some sets on the main lifts first.</div>';
  return key.map(o=>{const r=e1rm(o.b)/bw;
    return `<div class="item"><span class="body"><span class="t">${esc(o.x.n)}</span>
     <span class="small mute">est. 1RM ${Math.round(e1rm(o.b))} kg</span></span>

/* ---- STAT ---- */
function spark(v){if(v.length<2)return '<div class="empty small">Trend appears from the second entry.</div>';
  const w=300,h=52,mx=Math.max(...v),mn=Math.min(...v),r=(mx-mn)||1;
  const p=v.map((y,i)=>[i/(v.length-1)*w,h-4-((y-mn)/r)*(h-10)]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
   <path d="${p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')}" fill="none" stroke="#E8B923" stroke-width="2" stroke-linejoin="round"/>
   <circle cx="${p[p.length-1][0].toFixed(1)}" cy="${p[p.length-1][1].toFixed(1)}" r="3.2" fill="#E8B923"/></svg>`}
function vStat(){return `<div class="seg" role="group">
   <button data-stat="progress" aria-pressed="${stat==='progress'}">Progress</button>
   <button data-stat="history" aria-pressed="${stat==='history'}">History</button></div>
  ${stat==='progress'?statProg():statHist()}`}
function statProg(){
  const ids=[...new Set(S.sets.map(s=>s.ex))];

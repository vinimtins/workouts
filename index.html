<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#15181D;--steel:#1F242C;--steel-2:#2B323C;--line:#39414D;--chalk:#E7E4DC;
--mute:#8E97A4;--signal:#E8B923;--rest:#4B9FE1;--pad:16px;--r:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--ink);color:var(--chalk);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;overscroll-behavior-y:contain}
body.locked{overflow:hidden}
h1,h2,h3{font-family:"Barlow Condensed",Inter,system-ui,sans-serif;font-weight:600;letter-spacing:.02em;text-transform:uppercase;margin:0}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--ink);padding:calc(12px + env(safe-area-inset-top)) var(--pad) 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:25px;letter-spacing:.12em}
.brand .sub{color:var(--mute);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-family:"Barlow Condensed",sans-serif}
main{flex:1;padding:var(--pad);display:flex;flex-direction:column;gap:14px}
.card{background:var(--steel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h2{font-size:15px;letter-spacing:.14em;color:var(--mute)}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.spread{justify-content:space-between}
.mute{color:var(--mute)}.small{font-size:12.5px}.tight{gap:6px}
.hr{height:1px;background:var(--line);margin:10px 0}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-family:"Barlow Condensed",sans-serif;display:block;margin-bottom:5px}
.tag{font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;font-family:"Barlow Condensed",sans-serif}
.pill{font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:99px;background:var(--steel-2);color:var(--mute);font-family:"Barlow Condensed",sans-serif;white-space:nowrap}
.pill.on{background:var(--signal);color:var(--ink)}

/* ---- session header ---- */
.sess-grid{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:start}
.sess-grid .k{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sess-grid .v{font-size:15px;font-variant-numeric:tabular-nums}
.elapsed{font-family:"Barlow Condensed",sans-serif;font-size:31px;font-variant-numeric:tabular-nums;line-height:1}
.elapsed.held{color:var(--mute)}
.held-note{margin-top:8px;font-size:12.5px;color:var(--rest);border-left:2px solid var(--rest);padding-left:9px}
.hero.held{opacity:.55}
.hero.held .clock .t{color:var(--mute)}
.groups{text-align:right;font-family:"Barlow Condensed",sans-serif;font-size:17px;text-transform:uppercase;letter-spacing:.08em;line-height:1.25}

/* ---- exercise token row ---- */
.tokens{display:flex;gap:9px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.tokens::-webkit-scrollbar{display:none}
.tok{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);color:var(--mute);
  display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-size:15px;position:relative;background:transparent}
.tok.done{color:var(--mute);border-color:var(--steel-2)}
.tok.done::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;background:var(--mute);transform:rotate(-24deg)}
.tok.now{border-color:var(--signal);border-width:3px;color:var(--chalk);font-weight:700;box-shadow:0 0 0 3px rgba(232,185,35,.14)}

/* ---- calendar day strip ---- */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;padding:0}
.day .wd{font-family:"Barlow Condensed",sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.day .c{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);color:var(--mute);
  display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-size:14px;position:relative}
.day.trained .c{color:var(--chalk);border-color:var(--steel-2);background:var(--steel-2)}
.day.trained .c::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:2px;background:var(--signal);transform:rotate(-24deg)}
.day.today .c{border-color:var(--signal);border-width:3px;color:var(--chalk);font-weight:700;box-shadow:0 0 0 3px rgba(232,185,35,.14)}
.day.today .wd{color:var(--signal)}
.day.rest-day .c{border-style:dashed}

/* ---- start actions ---- */
.acts{display:flex;flex-direction:column;gap:9px}
.act{display:block;width:100%;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--ink)}
.act:active{border-color:var(--signal)}
.act.off{opacity:.42}
.act .an{display:block;font-family:"Barlow Condensed",sans-serif;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.act .ad{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
#acont:not(.off){border-color:var(--rest);background:rgba(75,159,225,.09)}
#acont:not(.off) .an{color:var(--rest)}
.parked{border-left:3px solid var(--rest);padding:2px 0 2px 11px}

/* ---- exercise figures ---- */
.exfig{display:block;width:100%;height:auto}
.mm-base{fill:#333B47}
.mm-off{fill:#454E5C}
.mm-sec{fill:#8E4038}
.mm-pri{fill:#D8453B}
.figbox{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;place-items:center}
.thumb{flex:0 0 52px;height:58px;background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px;display:grid;place-items:center;overflow:hidden}
.mtag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-family:"Barlow Condensed",sans-serif;
  padding:3px 8px;border-radius:99px;white-space:nowrap}
.mtag.pri{background:#D8453B;color:#fff}
.mtag.sec{background:#6E3630;color:#E7C9C6}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.excard{background:var(--steel);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:block;width:100%}
.excard:active{border-color:var(--signal)}
.excard .fw{background:var(--ink);border-radius:7px;padding:6px 0;margin-bottom:8px}
.excard .nm{font-family:"Barlow Condensed",sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.04em;line-height:1.15}
.excard .mt{font-size:11px;color:var(--mute);margin-top:3px}
.exdesc{font-size:14px;color:var(--chalk);opacity:.9;margin-top:10px}
.attrib{font-size:11px;color:var(--mute);text-align:center;font-style:italic}
.dots{display:flex;gap:5px;margin-top:12px}
.dot2{flex:1;height:3px;border-radius:99px;background:var(--line)}
.dot2.done{background:var(--mute)}
.dot2.now{background:var(--signal)}
.delta{font-family:"Barlow Condensed",sans-serif;font-size:14px;font-variant-numeric:tabular-nums;
  min-width:44px;text-align:right;color:var(--mute)}
.delta.up{color:var(--signal)}
.delta.down{color:var(--rest)}
textarea.search{resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.4}
.tick{flex:0 0 24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;
  font-size:14px;color:var(--ink);background:var(--ink)}
.tick.on{background:var(--signal);border-color:var(--signal)}
.sbox{flex:0 0 54px;height:44px;background:var(--ink);border:1px solid var(--line);border-radius:7px;
  display:grid;place-items:center;padding:3px}
.sicon{width:100%;height:100%;display:block}
.sicon .i1{fill:#6C7683}
.sicon .i2{fill:#49525F}
.sicon .i3{fill:#8E97A4}
.sicon .i4{fill:#E8B923}
.sicon .i3s{fill:none;stroke:#8E97A4;stroke-width:3;stroke-linecap:round}
.sicon .i4o{fill:none;stroke:#E8B923;stroke-width:2.6;stroke-linecap:round}
.sicon .ln{stroke:#8E97A4;stroke-width:1.2;fill:none}
.item.stn{align-items:center}
.item.stn.off .sbox{opacity:.34}
.item.stn.off .body{opacity:.5}
.cyc{display:flex;gap:7px}
.cd{flex:1;text-align:center;padding:7px 0;border:1px solid var(--line);border-radius:7px;
  font-family:"Barlow Condensed",sans-serif;font-size:14px;letter-spacing:.1em;color:var(--mute)}
.cd.rest{border-style:dashed}
.cd.now{background:var(--signal);border-color:var(--signal);color:var(--ink);font-weight:700}
.figbox img.exfig{max-height:230px;object-fit:contain;background:#fff;border-radius:6px}
.thumb img.exfig,.excard img.exfig{background:#fff;border-radius:5px;object-fit:contain}
.thumb img.exfig{max-height:50px}
.excard img.exfig{max-height:96px}

/* ---- animated exercise scenes ---- */
.scene{display:block;width:100%;height:auto}
.scene .lab{font-family:"Barlow Condensed",sans-serif;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;fill:#D8453B}
.scene .lab2{font-family:Inter,sans-serif;font-size:7.5px;fill:#98A1AE}
.scene .lead{stroke:#98A1AE;stroke-width:.7;fill:none}
.scene .sk{fill:#57616F}
.scene .sk2{fill:#49525F}
.scene .far{fill:#333B47}
.scene .pri{fill:#D8453B}
.scene .sec{fill:#9A4239}
.scene .sep{stroke:#3E4653;stroke-width:.8;fill:none}
/* two-bone arm: upper arm swings +122, forearm counter-rotates -112 so the
   forearm stays within 10 degrees of vertical, as it does under a real bar */
.scene .ua{transform-origin:146px 113px;animation:ua var(--dur,4s) cubic-bezier(.42,0,.58,1) infinite}
.scene .fa{transform-origin:146px 89px;animation:fa var(--dur,4s) cubic-bezier(.42,0,.58,1) infinite}
.scene .pec{transform-origin:161px 114px;animation:pec var(--dur,4s) cubic-bezier(.42,0,.58,1) infinite}
.scene .tri{animation:tri var(--dur,4s) cubic-bezier(.42,0,.58,1) infinite}
@keyframes ua{0%,9%{transform:rotate(0deg)}47%,56%{transform:rotate(122deg)}94%,100%{transform:rotate(0deg)}}
@keyframes fa{0%,9%{transform:rotate(0deg)}47%,56%{transform:rotate(-112deg)}94%,100%{transform:rotate(0deg)}}
@keyframes pec{0%,9%{transform:scale(.93,.90);opacity:1}47%,56%{transform:scale(1.06,1.10);opacity:.82}94%,100%{transform:scale(.93,.90);opacity:1}}
@keyframes tri{0%,9%{opacity:1}47%,56%{opacity:.6}94%,100%{opacity:1}}
.scene.paused .ua,.scene.paused .fa,.scene.paused .pec,.scene.paused .tri{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.scene .ua,.scene .fa,.scene .pec,.scene .tri{animation:none}}
.scene .flyL{transform-origin:150px 60px;animation:flyL var(--dur,4.4s) cubic-bezier(.42,0,.58,1) infinite}
.scene .flyR{transform-origin:150px 60px;animation:flyR var(--dur,4.4s) cubic-bezier(.42,0,.58,1) infinite}
.scene .pdfa{transform-origin:132px 106px;animation:pdfa var(--dur,3.4s) cubic-bezier(.42,0,.58,1) infinite}
.scene .ohfa{transform-origin:129px 61px;animation:ohfa var(--dur,3.8s) cubic-bezier(.42,0,.58,1) infinite}
@keyframes flyL{0%,9%{transform:rotate(0deg)}47%,56%{transform:rotate(-127deg)}94%,100%{transform:rotate(0deg)}}
@keyframes flyR{0%,9%{transform:rotate(0deg)}47%,56%{transform:rotate(127deg)}94%,100%{transform:rotate(0deg)}}
@keyframes pdfa{0%,10%{transform:rotate(0deg)}48%,58%{transform:rotate(-90deg)}92%,100%{transform:rotate(0deg)}}
@keyframes ohfa{0%,10%{transform:rotate(0deg)}48%,58%{transform:rotate(144deg)}92%,100%{transform:rotate(0deg)}}
/* incline shares the two-bone rig but has its own pivots and angles */
.sc-inc .ua{transform-origin:150px 110px;animation-name:uaInc}
.sc-inc .fa{transform-origin:150px 86px;animation-name:faInc}
.sc-inc .pec{transform-origin:162px 106px}
@keyframes uaInc{0%,9%{transform:rotate(0deg)}47%,56%{transform:rotate(117deg)}94%,100%{transform:rotate(0deg)}}
@keyframes faInc{0%,9%{transform:rotate(0deg)}47%,56%{transform:rotate(-126deg)}94%,100%{transform:rotate(0deg)}}
.scene.paused .flyL,.scene.paused .flyR,.scene.paused .pdfa,.scene.paused .ohfa{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.scene .flyL,.scene .flyR,.scene .pdfa,.scene .ohfa{animation:none}}


/* ---- timer hero ---- */
.hero{background:var(--steel);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;position:relative;overflow:hidden}
.hero.resting{border-color:var(--rest)}
.hero .ring{position:absolute;left:0;top:0;height:3px;background:var(--rest);transition:width .95s linear}
.hero .exname{font-family:"Barlow Condensed",sans-serif;font-size:23px;text-transform:uppercase;letter-spacing:.05em;line-height:1.1}
.clock{display:flex;align-items:center;gap:14px;margin:14px 0 4px}
.clock .t{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:66px;line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clock.rest .t{color:var(--rest)}
.clock .side{flex:1;text-align:right}
.clock .side .big{font-family:"Barlow Condensed",sans-serif;font-size:27px;font-variant-numeric:tabular-nums;line-height:1.1}
.mode{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.mode.rest{color:var(--rest)}
.ctl{display:grid;grid-template-columns:auto 1fr auto;gap:9px;margin-top:14px}
.btn{background:var(--signal);color:var(--ink);font-weight:600;border-radius:8px;padding:14px;width:100%;
 font-family:"Barlow Condensed",sans-serif;font-size:17px;letter-spacing:.1em;text-transform:uppercase;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--chalk);border:1px solid var(--line)}
.btn.blue{background:var(--rest)}
.btn.slim{padding:10px 14px;width:auto;font-size:14px}
.btn.wide{padding:15px}

/* ---- steppers ---- */
.field{flex:1;min-width:0}
.stepper{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--ink)}
.stepper button{flex:0 0 40px;font-size:20px;color:var(--mute);background:var(--steel-2);text-align:center}
.stepper button:active{background:var(--signal);color:var(--ink)}
.stepper input{flex:1;min-width:0;width:100%;text-align:center;background:transparent;border:0;padding:11px 0;font-size:20px;font-variant-numeric:tabular-nums;font-weight:600}
.search{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 13px;font-size:16px}
input:focus{outline:2px solid var(--signal);outline-offset:-2px}

/* ---- bar ---- */
.bar{display:flex;align-items:center;justify-content:center;height:52px;gap:1px}
.sleeve{height:6px;background:linear-gradient(#B9BEC7,#7C838E);flex:0 0 22px;border-radius:2px}
.knurl{height:10px;background:repeating-linear-gradient(90deg,#9AA1AC 0 2px,#6E757F 2px 4px);flex:0 0 30px;border-radius:2px}
.plate{width:11px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.bar-cap{font-family:"Barlow Condensed",sans-serif;font-size:11px;color:var(--mute);text-align:center;letter-spacing:.1em;text-transform:uppercase}

/* ---- lists ---- */
.item{display:flex;align-items:center;gap:11px;width:100%;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .body .t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .arw{color:var(--mute);font-size:17px}
.dot{flex:0 0 8px;height:8px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--signal)}
.x{margin-left:auto;color:var(--mute);padding:4px 8px;font-size:18px;line-height:1}
.empty{color:var(--mute);font-size:14px;padding:8px 0}
.seg{display:flex;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;text-align:center;padding:9px 4px;border-radius:6px;font-family:"Barlow Condensed",sans-serif;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--steel-2);color:var(--chalk)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;color:var(--mute);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:var(--ink);font-weight:600}

/* ---- sheet ---- */
#sheet{position:fixed;inset:0;z-index:40;display:none}#sheet.open{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(8,10,13,.72)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:88%;background:var(--steel);
 border:1px solid var(--line);border-radius:14px 14px 0 0;overflow-y:auto;padding:16px var(--pad) calc(24px + env(safe-area-inset-bottom));
 animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.cue{display:flex;gap:10px;padding:7px 0;font-size:14px}
.cue i{flex:0 0 16px;font-style:normal;color:var(--signal);font-family:"Barlow Condensed",sans-serif}

/* ---- stats ---- */
.spark{width:100%;height:52px;display:block}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-family:"Barlow Condensed",sans-serif}
.meter{height:5px;background:var(--ink);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--signal)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:35;background:var(--steel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{padding:12px 4px 14px;color:var(--mute);font-family:"Barlow Condensed",sans-serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase;border-top:2px solid transparent;text-align:center}
nav button[aria-current="true"]{color:var(--chalk);border-top-color:var(--signal)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header><div class="brand"><h1>Rack</h1><span class="sub" id="datesub"></span></div></header>
  <main id="view"></main>
</div>
<nav><div class="inner">
  <button data-tab="workout">Workout</button><button data-tab="plan">Plan</button>
  <button data-tab="bio">Bio</button><button data-tab="stat">Stat</button>
</div></nav>
<div id="sheet"><div class="scrim" data-close></div><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<script>
/* ================= storage ================= */
const KEY='rack:v3';
const store={
 async get(){try{if(window.storage){const r=await window.storage.get(KEY);return r?JSON.parse(r.value):null}
  const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}},
 async set(v){try{if(window.storage){await window.storage.set(KEY,JSON.stringify(v));return}
  localStorage.setItem(KEY,JSON.stringify(v))}catch(e){console.warn('Save failed',e)}}};

/* ================= exercise library ================= */
const RAW=[
["bsquat","Back squat","Legs","Barbell","Compound",1,"3–6",180,"Bar on rear delts, not neck|Brace hard before you unrack|Knees track over mid-foot|Break at hips and knees together","Glutes, core"],
["fsquat","Front squat","Legs","Barbell","Compound",1,"4–8",180,"Elbows high, bar rests on shoulders|Fingertip grip is enough|Stay upright, chest tall","Quads, upper back"],
["dead","Deadlift","Back","Barbell","Compound",1,"3–5",210,"Bar over mid-foot before you pull|Take the slack out first|Push the floor away, hips and chest rise together","Hamstrings, glutes, grip"],
["rdl","Romanian deadlift","Legs","Barbell","Compound",1,"6–10",150,"Soft knees, hinge at the hips|Bar stays against the thighs|Stop when hamstrings run out, not when the bar hits the floor","Glutes, lower back"],

/* ================= muscle map figures =================
   Optional real artwork: drop a URL or data-URI into IMG and it overrides the
   generated figure everywhere. Leave a key out and the muscle map is used.
   e.g. IMG.preacher = 'https://example.com/preacher-curl.png'                */
const IMG={};
/* ================= artwork layer =================
   Priority when drawing an exercise: saved artwork -> hardcoded IMG -> animated
   SCENE -> generated muscle map. Artwork is fetched from wger.de, whose exercise
   data is CC-BY-SA, so an attribution line is shown wherever an image is used.
   The wger JSON API may refuse cross-origin browser requests; if it does, the
   manual URL field below works regardless, because <img> loads are not subject
   to CORS.                                                                    */
const WGER='https://wger.de';
let artBusy=false,artLog=null;

const art=id=>(S.art&&S.art[id])||null;
function setArt(id,rec){S.art=S.art||{};if(rec)S.art[id]=rec;else delete S.art[id];save()}

async function wgerLookup(name){
  const url=`${WGER}/api/v2/exercise/search/?term=${encodeURIComponent(name)}&language=english&format=json`;
  const r=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!r.ok)throw new Error('wger returned '+r.status);
  const j=await r.json();
  const hit=(j.suggestions||[]).map(s=>s.data).find(d=>d&&d.image);
  if(!hit)return null;
  const abs=p=>p.startsWith('http')?p:WGER+p;
  return {url:abs(hit.image),thumb:hit.image_thumbnail?abs(hit.image_thumbnail):abs(hit.image),
    matched:hit.name||name,src:'wger'};
}

async function fetchArtFor(id,quiet){
  try{
    const rec=await wgerLookup(byId(id).n);
    if(rec){setArt(id,rec);return 'ok'}
    return 'none';
  }catch(e){if(!quiet)artLog={err:String(e.message||e)};return 'fail'}
}

async function fetchAllArt(){
  if(artBusy)return;artBusy=true;artLog={done:0,ok:0,none:0,fail:0,total:EX.length,err:null};render();
  for(const x of EX){
    if(art(x.id)){artLog.done++;artLog.ok++;continue}
    let res;
    try{res=await fetchArtFor(x.id,true)}catch(e){res='fail'}
    if(res==='fail'&&artLog.fail===0){
      try{await fetch(WGER+'/api/v2/exercise/search/?term=test&format=json')}
      catch(e){artLog.err='blocked'}
      if(!artLog.err)artLog.err='other';
    }
    artLog[res==='ok'?'ok':res==='none'?'none':'fail']++;artLog.done++;
    if(artLog.done%4===0)render();
    await new Promise(r=>setTimeout(r,250));
  }
  artBusy=false;save();render();
}

function artSheet(){
  const have=EX.filter(x=>art(x.id)).length;
  const l=artLog;
  return `<div class="row spread"><h2 style="font-size:22px;color:var(--chalk)">Exercise artwork</h2>
   <button class="pill" data-close>Close</button></div>
  <div class="small mute" style="margin:10px 0">Pulls illustrations from wger.de, an open fitness database.
   Its images are Creative Commons Attribution Share-Alike, so an attribution line appears wherever one is used.
   Anything without a match keeps the muscle map.</div>
  <div class="row spread"><span class="lbl" style="margin:0">Coverage</span>
    <span class="pill ${have?'on':''}">${have} of ${EX.length}</span></div>
  <div class="meter" style="margin:8px 0 14px"><i style="width:${have/EX.length*100}%"></i></div>
  ${l&&l.total?`<div class="small" style="margin-bottom:12px">
    ${artBusy?`Fetching… ${l.done} of ${l.total}`:`Finished. ${l.ok} matched, ${l.none} with no image, ${l.fail} failed.`}
    ${l.err==='blocked'?`<div class="held-note" style="margin-top:8px">wger refused the request from the browser.
      This is a cross-origin restriction on their API and cannot be fixed from this app.
      Use the per-exercise image field instead, which works for any image URL.</div>`:''}
    ${l.err==='other'?`<div class="held-note" style="margin-top:8px">The request failed. Check your connection and try again.</div>`:''}
  </div>`:''}
  <button class="btn" id="artall" ${artBusy?'disabled style="opacity:.5"':''}>${artBusy?'Fetching…':'Fetch artwork for all exercises'}</button>
  ${have?`<div style="height:9px"></div><button class="btn ghost" id="artclear">Remove all artwork</button>`:''}
  <div class="hr"></div>
  <div class="lbl">Per exercise</div>
  <div class="small mute">Open any exercise and use the image field there to paste your own photo or URL.
   That route always works, including offline if you paste a data URI.</div>`}

function artBlock(id){
  const a=art(id);
  return `<div class="hr"></div><div class="lbl">Image</div>
  ${a?`<div class="small mute" style="margin-bottom:8px">Showing artwork${a.matched?` matched as “${esc(a.matched)}”`:''}.</div>`:''}
  <input class="search" id="arturl" placeholder="Paste an image URL" value="${a?esc(a.url):''}">
  <div class="row" style="margin-top:9px;gap:8px">
    <button class="btn slim" data-artget="${id}" style="flex:1">Find on wger</button>
    <button class="btn ghost slim" data-artset="${id}" style="flex:1">Use this URL</button>
    ${a?`<button class="btn ghost slim" data-artdel="${id}">Clear</button>`:''}
  </div>`}

function attribution(id){
  const a=art(id);if(!a)return '';
  if(a.src!=='wger')return '<div class="attrib">Your own image</div>';
  return `<div class="attrib">Illustration from wger.de, licensed CC-BY-SA</div>`}

/* ---- plate maths against the inventory you actually own ---- */
function loadout(total){
  const g=G(),bar=+g.bar||0;
  let side=(total-bar)/2;
  if(side<-1e-9)return {under:true,bar};
  const out=[],used={};
  for(const sz of plateSizes()){
    const perSide=Math.floor((g.plates[String(sz)]||0)/2);
    while(side>=sz-1e-9&&(used[sz]||0)<perSide){out.push(sz);used[sz]=(used[sz]||0)+1;side=+(side-sz).toFixed(3)}
  }
  return {plates:out,left:+side.toFixed(2),bar}}
function barSVG(total){
  const g=G(),L=loadout(total);
  if(L.under)return `<div class="bar-cap">Below bar weight (${g.bar} ${g.unit})</div>`;
  if(!plateSizes().length)return `<div class="bar-cap">No plates set up · Plan › Gear</div>`;
  const h=sz=>Math.max(17,Math.min(50,18+Math.sqrt(sz)*6.5));
  const pl=a=>a.map(sz=>`<div class="plate" style="height:${h(sz)}px;background:${PCOL[String(sz)]||'#7A828E'}"></div>`).join('');
  const note=L.left>0?`${L.left} ${g.unit} short, closest you can load`
    :(L.plates.length?L.plates.join(' + ')+' per side':'empty bar');
  return `<div class="bar"><div class="sleeve"></div>${pl(L.plates.slice().reverse())}<div class="knurl"></div>${pl(L.plates)}<div class="sleeve"></div></div>
    <div class="bar-cap">${esc(note)}</div>`}

function byDay(id){const m={};S.sets.filter(s=>s.ex===id).forEach(s=>m[s.date]=(m[s.date]||0)+s.weight*s.reps);
 return Object.entries(m).sort().map(([d,v])=>({d,v}))}

function dayStrip(n){
  n=n||21;const set=trainedDays(),out=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);
    const k=d.toISOString().slice(0,10),did=set.has(k);
    out.push(`<button class="day ${did?'trained':'rest-day'} ${i===0?'today':''}" data-day="${k}"

      <span class="wd">${d.toLocaleDateString(undefined,{weekday:'narrow'})}</span>
      <span class="c">${d.getDate()}</span></button>`)}
  return `<div class="days" id="daystrip">${out.join('')}</div>`}
function streak(){const set=trainedDays();let n=0;const d=new Date();d.setHours(12,0,0,0);
  if(!set.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);
  while(set.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function last7(){const set=trainedDays();let n=0;const d=new Date();d.setHours(12,0,0,0);
  for(let i=0;i<7;i++){if(set.has(d.toISOString().slice(0,10)))n++;d.setDate(d.getDate()-1)}return n}

/* ================= monthly plans =================
   A plan is a rolling cycle of days. Day index comes from how many days have
   passed since the start date, so the cycle keeps turning regardless of what
   weekday it is. Set counts ramp week by week rather than being fixed.       */
/* a block is {ex, reps, hi, sets}. sets null means follow the weekly ramp.
   reps and hi give a range; when equal it renders as a single number.       */
const blk=(ex,reps,hi,sets)=>({ex,reps,hi:hi||reps,sets:sets||null});
function normBlocks(p){
  p.cycle.forEach(d=>d.b=d.b.map(b=>Array.isArray(b)?blk(b[0],b[1],b[1],b[2]):
    (b.hi?b:blk(b.ex,b.reps,b.reps,b.sets))));return p}

function seedPlan(){
  return {id:'p'+Date.now(),n:'Return to training',start:today(),weeks:4,
   prog:[2,2,3,3],

   cycle:[
    {k:'A',n:'Chest and triceps',b:[
      blk('bench',8,10),blk('incbench',8,10),blk('cablefly',12,15),blk('dbohp',10,12),
      blk('latraise',12,15),blk('pushdown',12,15),blk('ohtri1arm',12,15)]},
    {k:'B',n:'Back and biceps',b:[
      blk('latpull',8,12),blk('cablerow',8,12),blk('dbrow',8,12),blk('facepull',12,20),
      blk('cablecurl',10,12),blk('hammer',10,12)]},

      blk('gob',10,12),blk('rdl',8,12),blk('legext',12,15),blk('legcurl',12,15),
      blk('lunge',10,12),blk('plank',45),blk('carry',45)]},

   ]}}

const curPlan=()=>plans().find(p=>p.id===S.current)||plans()[0]||null;
const findWk=id=>plans().find(p=>p.id===id);
function planDay(p,d){
  const n=Math.floor((new Date(d||today())-new Date(p.start))/864e5);
  return {i:((n%p.cycle.length)+p.cycle.length)%p.cycle.length,
    week:Math.min(p.weeks,Math.floor(n/7)+1),day:n+1,past:n>=p.weeks*7}}
const weekSets=p=>{const w=planDay(p).week;return p.prog[Math.min(w,p.prog.length)-1]||3};
const blkSets=(p,b)=>b.sets||weekSets(p);
const daySets=(p,i)=>p.cycle[i].b.reduce((a,b)=>a+blkSets(p,b),0);
const planDur=(p,i)=>Math.round(daySets(p,i)*2);
const repTxt=b=>b.hi>30?b.reps+'s':(b.reps===b.hi?b.reps+' reps':b.reps+'\u2013'+b.hi+' reps');
const planSets=weekSets;

function startPlanDay(p,i){
  const d=p.cycle[i];
  S.session={wk:p.id,name:`${d.k} · ${d.n}`,start:Date.now(),accum:0,runningSince:Date.now(),idx:0,
    blocks:d.b.map(b=>({ex:b.ex,target:blkSets(p,b),reps:b.hi,logged:0,weight:suggest(b.ex)}))};
  S.parked=null;mode='idle';t=0;paused=false;save();tab='workout';closeSheet();render()}
function startSession(id){const p=findWk(id);if(p)startPlanDay(p,planDay(p).i)}

function startFreestyle(){
  S.session={wk:null,name:'Freestyle',start:Date.now(),accum:0,runningSince:Date.now(),idx:0,blocks:[]};
  S.parked=null;mode='idle';t=0;paused=false;save();tab='plan';plan='exercises';closeSheet();render()}
function parkSession(){const s=S.session;if(!s)return;
  if(s.runningSince){s.accum+=(Date.now()-s.runningSince)/1000;s.runningSince=null}
  S.parked=s;S.session=null;stopTimer();save();tab='workout';render()}
function resumeParked(){if(!S.parked)return;
  S.session=S.parked;S.parked=null;mode='idle';t=0;paused=true;save();tab='workout';render()}
const sessionRunning=()=>!!(S.session&&S.session.runningSince);
function sessionElapsed(){const s=S.session;if(!s)return 0;
  return s.accum+(s.runningSince?(Date.now()-s.runningSince)/1000:0)}
function pauseSession(){const s=S.session;if(!s||!s.runningSince)return;
  s.accum+=(Date.now()-s.runningSince)/1000;s.runningSince=null;
  paused=true;save();render()}
function resumeSession(){const s=S.session;if(!s||s.runningSince)return;
  s.runningSince=Date.now();paused=false;save();render()}
function cur(){return S.session?S.session.blocks[S.session.idx]:null}
function sessionGroups(){if(!S.session)return'';
  return [...new Set(S.session.blocks.map(b=>byId(b.ex).g))].join('<br>')}
function advance(){const s=S.session;
  const next=s.blocks.findIndex((b,i)=>i>s.idx&&b.logged<b.target);
  s.idx=next>-1?next:s.blocks.findIndex(b=>b.logged<b.target);
  if(s.idx<0)s.idx=s.blocks.length-1}

/* ================= timer ================= */
function stopTick(){clearInterval(tick);tick=null}
function beginSet(){mode='set';t=0;paused=false;stopTick();
  tick=setInterval(()=>{if(!paused){t++;paintClock()}},1000);render()}
function finishSet(){
  const b=cur();if(!b)return;
  S.sets.push({id:Date.now()+''+Math.random(),date:today(),ex:b.ex,reps:b.reps,weight:b.weight,dur:t});
  b.logged++;save();
  const rest=byId(b.ex).rest;
  if(b.logged>=b.target)advance();
  mode='rest';restTotal=t=rest;paused=false;stopTick();
  tick=setInterval(()=>{if(!paused){t--;paintClock();if(t<=0){stopTick();mode='idle';
    if(navigator.vibrate)navigator.vibrate([120,80,120]);render()}}},1000);
  render()}
function stopTimer(){stopTick();mode='idle';t=0;paused=false;render()}
function paintClock(){const c=el('clockval');if(c)c.textContent=mmss(t);
  const r=el('ring');if(r&&mode==='rest')r.style.width=(t/restTotal*100)+'%'}
function paintElapsed(){const e=el('elapsed');if(e&&S.session)e.textContent=hhmm(sessionElapsed())}
clearInterval(elapsedTick);elapsedTick=setInterval(paintElapsed,1000);

/* ================= views ================= */
function render(){
  el('datesub').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));
  el('view').innerHTML={workout:vWorkout,plan:vPlan,bio:vBio,stat:vStat,build:vBuild}[tab]();
  wire();paintElapsed()}

function newDraft(){return {n:'',weeks:4,prog:[2,2,3,3],note:'',

function savePlan(){
  const d=S.draft;if(!d||!d.cycle.some(c=>c.b.length))return;
  const id=d.id||('p'+Date.now());
  const plan={id,n:d.n.trim()||'Untitled block',start:d.start||today(),weeks:d.weeks,
    prog:d.prog.slice(0,d.weeks),note:d.note,cycle:d.cycle};
  plan.ts=Date.now();S.plans=(S.plans||[]).filter(q=>q.id!==id);S.plans.unshift(plan);S.current=id;
  S.draft=null;pickFor=null;save();tab='plan';plan='workouts';render()}

/* ---- BIO ---- */
/* ================= body check-in =================
   Deliberately narrow. Anything a watch or smart scale already measures is left
   out, because duplicating it means two records that drift apart. What remains
   is what no device can read: a tape measure, and body weight.               */
const MEAS=[
 ['waist','Waist','At the navel, standing relaxed, after a normal exhale'],
 ['neck','Neck','Just below the Adam\u2019s apple, tape level'],
 ['chest','Chest','Around the widest point, arms hanging relaxed'],
 ['hips','Hips','Around the widest point of the glutes'],
 ['armL','Left arm','Mid-bicep. Flexed or relaxed, but pick one and keep it'],
 ['armR','Right arm','Same position and state as the left'],
 ['thighL','Left thigh','Halfway between hip crease and knee'],
 ['thighR','Right thigh','Same height as the left'],
 ['calfL','Left calf','At the widest point'],
 ['calfR','Right calf','Same as the left'],
 ['bf','Body fat','Optional. Whatever method you use, stay with the same one']
];
const CHECK_DAYS=90;
/* ================= data import and backup =================
   Renpho exports CSV from Trends. Column names vary by app version and locale,
   so nothing is hardcoded: headers are matched against synonyms, everything is
   previewed before it is written, and unmatched columns are reported rather
   than silently dropped.                                                     */
const IMPORT_MAP={
 date:['time','date','measured','timestamp','datetime','measurement time','日期','时间'],
 weight:['weight','body weight','bodyweight','mass','peso'],
 bf:['body fat','bodyfat','fat percentage','fat %','fat(%)','body fat rate','fat'],
 neck:['neck','collar'],
 chest:['chest','bust','torso'],
 waist:['waist','abdomen','belly'],
 hips:['hip','hips','buttocks','glutes'],
 armL:['left arm','left upper arm','left bicep','left biceps','l arm','arm left'],
 armR:['right arm','right upper arm','right bicep','right biceps','r arm','arm right'],
 thighL:['left thigh','left leg','l thigh','thigh left'],
 thighR:['right thigh','right leg','r thigh','thigh right'],
 calfL:['left calf','l calf','calf left'],
 calfR:['right calf','r calf','calf right']
};
let imp=null;   /* {rows, cols, unit, wunit, text, unmatched} */

function parseCSV(text){
  const t=text.replace(/\r\n?/g,'\n').trim();
  if(!t)return {headers:[],rows:[]};
  const delim=[',',';','\t'].map(d=>({d,n:(t.split('\n')[0].split(d).length)}))
    .sort((a,b)=>b.n-a.n)[0].d;
  const line=l=>{const out=[];let cur='',q=false;
    for(let i=0;i<l.length;i++){const c=l[i];
      if(q){if(c==='"'&&l[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}
      else if(c==='"')q=true;else if(c===delim){out.push(cur.trim());cur=''}else cur+=c}
    out.push(cur.trim());return out};
  const all=t.split('\n').filter(l=>l.trim()).map(line);
  return {headers:all[0].map(h=>h.replace(/^\ufeff/,'')),rows:all.slice(1),delim}}

function detectCols(headers){
  const cols={},used=new Set();
  headers.forEach((h,i)=>{
    const clean=h.toLowerCase().replace(/\(.*?\)/g,'').replace(/[_\-]/g,' ').trim();
    for(const [field,syn] of Object.entries(IMPORT_MAP)){
      if(cols[field]!==undefined)continue;
      if(syn.some(x=>clean===x)||syn.some(x=>clean.startsWith(x+' ')||clean.endsWith(' '+x))){
        cols[field]=i;used.add(i);return}}
  });
  /* second, looser pass for anything still unclaimed */
  headers.forEach((h,i)=>{if(used.has(i))return;
    const clean=h.toLowerCase();
    for(const [field,syn] of Object.entries(IMPORT_MAP)){
      if(cols[field]!==undefined)continue;
      if(syn.some(x=>clean.includes(x))){cols[field]=i;used.add(i);return}}});
  const unmatched=headers.filter((h,i)=>!used.has(i)&&h);
  return {cols,unmatched}}

function parseDate(v,order){
  if(!v)return null;
  const s=String(v).trim().split(/[ T]/)[0];
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
  if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);
  if(m){const a=+m[1],b=+m[2];
    const day=order==='mdy'?b:a, mon=order==='mdy'?a:b;
    return `${m[3]}-${String(mon).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
  const d=new Date(v);return isNaN(d)?null:d.toISOString().slice(0,10)}

/* 03/04 is ambiguous; a value above 12 in either slot settles it */
function detectOrder(rows,di){
  let dmy=false,mdy=false;
  rows.forEach(r=>{const m=String(r[di]||'').trim().split(/[ T]/)[0]
    .match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.]\d{4}$/);
    if(!m)return; if(+m[1]>12)dmy=true; if(+m[2]>12)mdy=true});
  return mdy&&!dmy?'mdy':dmy&&!mdy?'dmy':null}

function impRows(){
  if(!imp)return [];
  const {cols}=imp,out=[];
  imp.rows.forEach(r=>{
    const d=parseDate(r[cols.date],imp.dorder);if(!d)return;
    const rec={d,vals:{},weight:null};
    Object.entries(cols).forEach(([f,i])=>{
      if(f==='date')return;
      const raw=String(r[i]||'').replace(',','.').replace(/[^\d.\-]/g,'');
      const v=parseFloat(raw);if(!isFinite(v)||v<=0)return;
      if(f==='weight')rec.weight=imp.wunit==='lb'?+(v*0.45359237).toFixed(1):+v.toFixed(1);
      else rec.vals[f]=f==='bf'?+v.toFixed(1):(imp.unit==='in'?+(v*2.54).toFixed(1):+v.toFixed(1));
    });
    if(rec.weight!=null||Object.keys(rec.vals).length)out.push(rec)});
  /* one record per day, latest wins */
  const byDay={};out.forEach(r=>byDay[r.d]=r);
  return Object.values(byDay).sort((a,b)=>a.d<b.d?-1:1)}

function doImport(){
  const rows=impRows();let w=0,c=0;
  rows.forEach(r=>{
    if(r.weight!=null){S.bio=S.bio.filter(x=>x.d!==r.d);S.bio.push({d:r.d,v:r.weight,ts:Date.now()});w++}
    if(Object.keys(r.vals).length){
      const ex=(S.checks||[]).find(x=>x.d===r.d);
      if(ex)Object.assign(ex.vals,r.vals);
      else (S.checks=S.checks||[]).push({d:r.d,vals:r.vals,ts:Date.now()});
      c++}});
  imp=null;save();closeSheet();render();
  setTimeout(()=>alert(`Imported ${w} weight entries and ${c} measurement sets.`),80)}

function importSheet(){

  <div class="small mute" style="margin:10px 0">In the Renpho app: Trends, then Circumference or Weight, then the export icon.
    Save the CSV, then either choose the file below or paste its contents.</div>
  <input type="file" id="impfile" accept=".csv,.txt,text/csv" class="search" style="padding:9px">
  <div style="height:9px"></div>
  <textarea class="search" id="imptext" rows="4" placeholder="or paste the CSV here">${imp?esc(imp.text.slice(0,2000)):''}</textarea>
  <div class="row" style="margin-top:9px;gap:8px">
    <div class="field"><span class="lbl">Lengths</span>
      <div class="seg"><button data-iu="cm" aria-pressed="${!imp||imp.unit==='cm'}">cm</button>
      <button data-iu="in" aria-pressed="${imp&&imp.unit==='in'}">in</button></div></div>
    <div class="field"><span class="lbl">Weight</span>

  </div>
  ${imp&&imp.ambiguous?`<div style="height:9px"></div>

    <button data-io="mdy" aria-pressed="${imp.dorder==='mdy'}">Month / day</button></div>`:''}
  <div style="height:10px"></div>
  <button class="btn ghost" id="impparse">Read the file</button>
  ${imp?`<div class="hr"></div>
    <div class="row spread"><span class="lbl" style="margin:0">Matched columns</span>
      <span class="pill ${rows.length?'on':''}">${rows.length} dated rows</span></div>
    <div class="row wrap tight" style="margin:8px 0">
      ${matched.length?matched.map(f=>`<span class="mtag sec">${esc(label(f))}</span>`).join(''):'<span class="small mute">Nothing recognised</span>'}</div>
    ${imp.unmatched.length?`<div class="small mute">Ignored: ${esc(imp.unmatched.join(', '))}</div>`:''}
    ${rows.length?`<div class="hr"></div><div class="lbl">Preview, most recent first</div>
      ${rows.slice().reverse().slice(0,5).map(r=>`<div class="item"><span class="body">

        <span class="small mute">${[r.weight!=null?r.weight+' kg':null,
          ...Object.entries(r.vals).map(([k,v])=>label(k)+' '+v+(k==='bf'?'%':'cm'))].filter(Boolean).join(' · ')}</span>
        </span></div>`).join('')}
      <div style="height:14px"></div>
      <button class="btn" id="impgo">Import ${rows.length} rows</button>
      <div class="small mute" style="margin-top:8px">Existing entries on the same date are updated, not duplicated.</div>`
    :'<div class="held-note" style="margin-top:10px">No dated rows found. Check that the file has a date or time column.</div>'}`
  :''}`}

/* ================= GitHub sync =================
   One JSON file in a private repo, written through the GitHub contents API.
   Every save is a commit, so the repo doubles as a full timestamped history.

   Merge strategy, since two devices can both be ahead:
     sets / bio / checks -> merged item by item, newest timestamp wins,
                            with tombstones so a deletion is not resurrected
     plans / gear / art  -> taken wholesale from whichever document was
                            saved more recently, since config rarely differs  */
const SYNC_DEFAULT={token:'',repo:'',path:'workouts.json',branch:'main',sha:null,
  lastPull:null,lastPush:null,on:false};
const SY=()=>{if(!S.sync)S.sync=Object.assign({},SYNC_DEFAULT);return S.sync};
let syncBusy=false,syncErr=null,pushTimer=null,syncNote='';

const b64enc=str=>{const b=new TextEncoder().encode(str);let s='';
  for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
  return btoa(s)};
const b64dec=str=>new TextDecoder().decode(
  Uint8Array.from(atob(String(str).replace(/\s/g,'')),c=>c.charCodeAt(0)));

async function ghFetch(method,body){
  const y=SY();
  if(!y.token||!y.repo)throw new Error('Sync is not set up');
  const url=`https://api.github.com/repos/${y.repo}/contents/${y.path}`+
    (method==='GET'?`?ref=${encodeURIComponent(y.branch)}&t=${Date.now()}`:'');
  const r=await fetch(url,{method,
    headers:{'Authorization':'Bearer '+y.token,'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},
    ...(body?{body:JSON.stringify(body)}:{})});
  if(r.status===404&&method==='GET')return null;
  if(!r.ok){
    let m=r.status+'';try{const j=await r.json();m=j.message||m}catch(e){}
    if(r.status===401)m='Token rejected. Check it was copied whole.';
    if(r.status===403)m='Access refused. Check the token can write Contents on this repo.';
    if(r.status===404)m='Repo or path not found. Check the owner/name is exact.';
    throw new Error(m)}
  return r.json()}

/* ---- what counts as one item, and how items are keyed ---- */
const SYNC_LISTS=[['sets','id'],['bio','d'],['checks','d']];
function mergeDoc(local,remote){
  if(!remote)return {out:local,changed:false};
  const out=Object.assign({},local);
  const lm=local.mtime||0, rm=remote.mtime||0;
  let changed=false;

  /* tombstones from both sides */
  const del={};[...(local.del||[]),...(remote.del||[])].forEach(t=>{
    if(!del[t.id]||del[t.id]<t.ts)del[t.id]=t.ts});
  out.del=Object.entries(del).map(([id,ts])=>({id,ts}))
    .filter(t=>Date.now()-t.ts<90*864e5);

  SYNC_LISTS.forEach(([key,idf])=>{
    const map={};
    (local[key]||[]).forEach(x=>map[x[idf]]=x);
    (remote[key]||[]).forEach(x=>{
      const k=x[idf],cur=map[k];
      if(!cur){map[k]=x;changed=true}
      else if((x.ts||rm)>(cur.ts||lm)){map[k]=x;changed=true}});
    let arr=Object.values(map).filter(x=>{
      const t=del[x[idf]];return !(t&&t>=(x.ts||0))});
    arr.sort((a,b)=>String(a[idf]).localeCompare(String(b[idf])));
    if(key==='sets')arr.sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:0));
    out[key]=arr});

  /* configuration: the more recently saved document wins outright */
  if(rm>lm){['plans','current','gear','art','height','session','parked','done']
    .forEach(k=>{if(k in remote){out[k]=remote[k];changed=true}})}
  out.mtime=Math.max(lm,rm);
  return {out,changed}}

async function syncPull(quiet){
  const y=SY();syncBusy=true;syncErr=null;if(!quiet)render();
  try{
    const res=await ghFetch('GET');
    if(!res){syncNote='Nothing saved in the repo yet.';y.sha=null}
    else{
      y.sha=res.sha;
      const remote=JSON.parse(b64dec(res.content));
      const {out,changed}=mergeDoc(S,remote);
      Object.assign(S,out);
      if(!S.art)S.art={};if(!S.checks)S.checks=[];(S.plans||[]).forEach(normBlocks);
      syncNote=changed?'Pulled changes from the repo.':'Already up to date.';
    }
    y.lastPull=Date.now();await save();
  }catch(e){syncErr=e.message}
  syncBusy=false;if(!quiet)render();
}

async function syncPush(retry){
  const y=SY();if(!y.on||!y.token||!y.repo)return;
  syncBusy=true;syncErr=null;
  try{
    S.mtime=Date.now();
    const payload=Object.assign({},S);delete payload.sync;
    const res=await ghFetch('PUT',{
      message:`workout data ${new Date().toISOString().slice(0,16).replace('T',' ')}`,
      content:b64enc(JSON.stringify(payload)),branch:y.branch,...(y.sha?{sha:y.sha}:{})});
    y.sha=res.content.sha;y.lastPush=Date.now();syncNote='Saved to the repo.';
    await save();
  }catch(e){
    /* someone else wrote first: pull, merge, try once more */
    if(!retry&&/sha|conflict|409|422/i.test(e.message)){
      syncBusy=false;await syncPull(true);return syncPush(true)}
    syncErr=e.message}
  syncBusy=false;
  const b=el('syncline');if(b)b.textContent=syncLine();
}
function schedulePush(){
  const y=S.sync;if(!y||!y.on)return;
  clearTimeout(pushTimer);pushTimer=setTimeout(()=>syncPush(false),4000)}

const ago=t=>{if(!t)return 'never';const s=(Date.now()-t)/1000;
  return s<60?'just now':s<3600?Math.round(s/60)+' min ago':
    s<86400?Math.round(s/3600)+' h ago':Math.round(s/86400)+' d ago'};
const syncLine=()=>{const y=SY();
  return syncBusy?'Syncing…':syncErr?('Problem: '+syncErr):
    y.on?`Last saved ${ago(y.lastPush)} · pulled ${ago(y.lastPull)}`:'Not connected'};

function syncSheet(){
  const y=SY();
  return `<div class="row spread"><h2 style="font-size:21px;color:var(--chalk)">Cloud sync</h2>
    <button class="pill" data-close>Close</button></div>
  <div class="small mute" style="margin:10px 0">Keeps one JSON file in a private GitHub repo.
    Every save is a commit, so you get a dated history and can open the file yourself.</div>
  <span class="lbl">Repository</span>
  <input class="search" id="syrepo" placeholder="owner/name" value="${esc(y.repo)}" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div style="height:9px"></div>
  <span class="lbl">Access token</span>
  <input class="search" id="sytok" type="password" placeholder="github_pat_..." value="${esc(y.token)}" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div style="height:9px"></div>
  <div class="row" style="gap:8px">
    <div class="field"><span class="lbl">File</span>
      <input class="search" id="sypath" value="${esc(y.path)}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><span class="lbl">Branch</span>
      <input class="search" id="sybranch" value="${esc(y.branch)}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
  </div>
  <div class="hr"></div>
  <div class="row spread"><span class="lbl" style="margin:0">Status</span>
    <span class="pill ${y.on?(syncErr?'':'on'):''}">${y.on?(syncErr?'error':'connected'):'off'}</span></div>
  <div class="small ${syncErr?'':'mute'}" id="syncline" style="margin-top:4px;${syncErr?'color:var(--rest)':''}">${esc(syncLine())}</div>
  ${syncNote&&!syncErr?`<div class="small mute" style="margin-top:2px">${esc(syncNote)}</div>`:''}
  <div style="height:14px"></div>
  ${y.on?`<div class="row" style="gap:8px">
      <button class="btn slim" id="synow" style="flex:1">Sync now</button>
      <button class="btn ghost slim" id="syoff" style="flex:1">Disconnect</button></div>`
   :`<button class="btn" id="syon">Connect and test</button>`}
  <div class="hr"></div>
  <div class="small mute">The token is stored on this device only. Scope it to this one repo, and if you lose a device, delete the token on GitHub.</div>`}

/* ---- whole-app backup ---- */
function exportBackup(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`rack-backup-${today()}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function restoreBackup(text){
  try{
    const o=JSON.parse(text);
    if(!o||typeof o!=='object'||!('sets' in o))throw new Error('not a Rack backup');
    S=Object.assign({},S,o);
    if(!S.art)S.art={};if(!S.checks)S.checks=[];(S.plans||[]).forEach(normBlocks);
    save();render();alert('Backup restored.')
  }catch(e){alert('Could not read that file: '+e.message)}}

let chk=null;   /* {i, vals} while a check-in is in progress */

const checks=()=>(S.checks||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
const lastCheck=()=>{const c=checks();return c.length?c[c.length-1]:null};
function daysSinceCheck(){const l=lastCheck();if(!l)return null;
  return Math.round((new Date(today())-new Date(l.d))/864e5)}

function startCheck(){
  const l=lastCheck();
  chk={i:0,vals:Object.assign({},l?l.vals:{})};
  openSheet(checkSheet())}
function saveCheck(){
  const vals={};Object.keys(chk.vals).forEach(k=>{if(chk.vals[k])vals[k]=+chk.vals[k]});
  S.checks=(S.checks||[]).filter(c=>c.d!==today());
  S.checks.push({d:today(),vals,ts:Date.now()});chk=null;save();closeSheet();render()}

function checkSheet(){
  const [key,name,hint]=MEAS[chk.i];
  const prev=lastCheck(), pv=prev&&prev.vals[key];
  const v=chk.vals[key]||'';
  const unit=key==='bf'?'%':'cm';
  const step=key==='bf'?0.1:0.5;
  return `<div class="row spread"><h2 style="font-size:20px;color:var(--chalk)">Check-in</h2>
    <button class="pill" id="chkquit">Cancel</button></div>
  <div class="dots">${MEAS.map((m,i)=>`<span class="dot2 ${i<chk.i?'done':''} ${i===chk.i?'now':''}"></span>`).join('')}</div>
  <div class="lbl" style="margin-top:14px">Step ${chk.i+1} of ${MEAS.length}</div>
  <div style="font-family:'Barlow Condensed',sans-serif;font-size:27px;text-transform:uppercase;letter-spacing:.05em">${esc(name)}</div>
  <div class="small mute" style="margin:4px 0 14px">${esc(hint)}</div>
  <div class="stepper" style="max-width:260px">
    <button data-chk="-">−</button>
    <input id="chkval" type="number" inputmode="decimal" step="${step}" value="${v}" placeholder="${pv||'—'}">
    <button data-chk="+">+</button></div>
  <div class="small mute" style="margin-top:8px">
    ${pv?`Last time ${pv} ${unit}${v&&+v!==pv?` · ${(+v-pv>0?'+':'')+(+v-pv).toFixed(1)} ${unit}`:''}`:`No previous reading. Units are ${unit}.`}</div>
  <div class="row" style="margin-top:18px;gap:8px">
    <button class="btn ghost slim" id="chkback" ${chk.i?'':'style="opacity:.4"'} style="flex:1">Back</button>
    <button class="btn ghost slim" id="chkskip" style="flex:1">Skip</button>
    <button class="btn slim" id="chknext" style="flex:2">${chk.i===MEAS.length-1?'Save check-in':'Next'}</button>
  </div>`}

function deltaRow(key,name,cur,prev,unit){
  if(cur==null)return '';
  const d=prev==null?null:+(cur-prev).toFixed(1);
  const cls=d===null?'':d>0?'up':d<0?'down':'';
  return `<div class="item"><span class="body"><span class="t">${esc(name)}</span></span>
    <span class="num" style="font-size:16px">${cur} ${unit}</span>
    ${d===null?'<span class="pill">new</span>'
     :`<span class="delta ${cls}">${d>0?'+':''}${d}</span>`}</div>`}

    <div class="small mute" style="margin:8px 0 12px">

      <div style="height:4px"></div>
      ${MEAS.map(([k,n])=>deltaRow(k,n,cur.vals[k]!=null?cur.vals[k]:null,

        <div class="row" style="gap:24px">
          <div class="stat"><b class="num">${(cur.vals.waist/S.height).toFixed(2)}</b><span>waist / height</span></div>
          <div class="stat"><b class="num">${cur.vals.waist/S.height<0.5?'Under':'Over'}</b><span>0.50 marker</span></div>
        </div>`:''}`:''}
  </div>

  <div class="card">
    <div class="row spread"><h2>Height</h2><span class="pill">${S.height?S.height+' cm':'not set'}</span></div>
    <div class="small mute" style="margin:6px 0 10px">Entered once. Lets waist-to-height calculate itself.</div>
    <div class="row"><div class="field">
      <div class="stepper"><button data-ht="-">−</button>
      <input id="ht" type="number" inputmode="decimal" step="0.5" value="${S.height||175}">
      <button data-ht="+">+</button></div></div>
      <button class="btn slim" id="setht" style="padding:13px 18px">Set</button></div>

  <div class="card">

  <div class="card"><h2>Relative strength</h2><div style="height:6px"></div>

  ${c.length>1?`<div class="card"><h2>Past check-ins</h2><div style="height:4px"></div>
   ${c.slice().reverse().map(e=>`<div class="item"><span class="body">

    <span class="num">${e.v} kg</span><button class="x" data-delbio="${e.d}" aria-label="Remove">×</button></div>`).join('')

function relStrength(bw){
  const key=['bsquat','bench','dead','ohp'].map(id=>({x:byId(id),b:bestEver(id)})).filter(o=>o.b);
  if(!key.length)return '<div class="empty">Log some sets on the main lifts first.</div>';
  return key.map(o=>{const r=e1rm(o.b)/bw;
    return `<div class="item"><span class="body"><span class="t">${esc(o.x.n)}</span>
     <span class="small mute">est. 1RM ${Math.round(e1rm(o.b))} kg</span></span>
     <span class="num" style="font-size:18px">${r.toFixed(2)}×</span></div>`}).join('')}

/* ---- STAT ---- */
function spark(v){if(v.length<2)return '<div class="empty small">Trend appears from the second entry.</div>';
  const w=300,h=52,mx=Math.max(...v),mn=Math.min(...v),r=(mx-mn)||1;
  const p=v.map((y,i)=>[i/(v.length-1)*w,h-4-((y-mn)/r)*(h-10)]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
   <path d="${p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')}" fill="none" stroke="#E8B923" stroke-width="2" stroke-linejoin="round"/>
   <circle cx="${p[p.length-1][0].toFixed(1)}" cy="${p[p.length-1][1].toFixed(1)}" r="3.2" fill="#E8B923"/></svg>`}
function vStat(){return `<div class="seg" role="group">
   <button data-stat="progress" aria-pressed="${stat==='progress'}">Progress</button>
   <button data-stat="history" aria-pressed="${stat==='history'}">History</button></div>
  ${stat==='progress'?statProg():statHist()}`}
function statProg(){
  const ids=[...new Set(S.sets.map(s=>s.ex))];
  if(!ids.length)return '<div class="card"><h2>Progress</h2><div class="empty">Run a session and your best sets and volume trend show up here.</div></div>';
  const days=[...new Set(S.sets.map(s=>s.date))];
  return `<div class="card"><h2>All time</h2><div style="height:10px"></div>
    <div class="row" style="gap:24px">
      <div class="stat"><b class="num">${days.length}</b><span>sessions</span></div>
      <div class="stat"><b class="num">${S.sets.length}</b><span>sets</span></div>
      <div class="stat"><b class="num">${Math.round(vol(S.sets)/1000)}t</b><span>total volume</span></div></div></div>
  ${ids.map(id=>{const h=byDay(id),b=bestEver(id),x=byId(id);
   return `<div class="card"><div class="row spread"><h2>${esc(x.n)}</h2><span class="pill">${h.length} days</span></div>
    ${spark(h.map(d=>d.v))}<div class="hr"></div><div class="row" style="gap:24px">
     <div class="stat"><b class="num">${b.weight}</b><span>best kg</span></div>
     <div class="stat"><b class="num">${Math.round(e1rm(b))}</b><span>est. 1rm</span></div>
     <div class="stat"><b class="num">${Math.round(h[h.length-1].v).toLocaleString()}</b><span>last volume</span></div>
    </div></div>`}).join('')}`}
function statHist(){
  const days=[...new Set(S.sets.map(s=>s.date))].sort().reverse();
  if(!days.length)return '<div class="card"><h2>History</h2><div class="empty">Nothing logged yet.</div></div>';
  return days.map(d=>{const ss=S.sets.filter(s=>s.date===d),m={};ss.forEach(s=>(m[s.ex]=m[s.ex]||[]).push(s));
   return `<div class="card"><div class="row spread">
    <h2>${new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})}</h2>
    <span class="pill">${Math.round(vol(ss)).toLocaleString()} kg</span></div><div style="height:4px"></div>
    ${Object.entries(m).map(([id,l])=>`<div class="item"><span class="body"><span class="t">${esc(byId(id).n)}</span></span>
     <span class="small mute num">${l.map(s=>(s.weight?s.weight+'×':'')+s.reps).join(', ')}</span></div>`).join('')}</div>`}).join('')}

/* ---- sheets ---- */
function openSheet(h){el('panel').innerHTML='<div class="grab"></div>'+h;el('sheet').classList.add('open');
  document.body.classList.add('locked');wire()}
function closeSheet(){el('sheet').classList.remove('open');document.body.classList.remove('locked')}
function daySheet(d){
  const ss=S.sets.filter(s=>s.date===d),m={};ss.forEach(s=>(m[s.ex]=m[s.ex]||[]).push(s));

    <span class="pill on">${Object.keys(m).length} lifts</span><span class="pill">${ss.length} sets</span>
    <span class="pill">${Math.round(vol(ss)).toLocaleString()} kg</span></div>
   ${Object.entries(m).map(([id,l])=>`<div class="item"><span class="body"><span class="t">${esc(byId(id).n)}</span>
    <span class="small mute num">${l.map(s=>(s.weight?s.weight+' kg × ':'')+s.reps).join(' · ')}</span></span></div>`).join('')}`

function exSheet(id){const x=byId(id),b=bestEver(id),h=byDay(id);
  return `<div class="row spread"><h2 style="font-size:23px;color:var(--chalk)">${esc(x.n)}</h2>
   <button class="pill" data-close>Close</button></div>
  <div class="row wrap tight" style="margin:10px 0"><span class="pill">${esc(x.g)}</span><span class="pill">${esc(x.eq)}</span>
   <span class="pill">${esc(x.t)}</span><span class="pill">${esc(x.rep)} reps</span><span class="pill">${x.rest}s rest</span></div>
  ${SCENE[id]?`<div class="figbox" style="margin-bottom:8px">${SCENE[id]()}</div>
    <div class="row spread" style="margin-bottom:10px"><span class="tag">Movement</span>
    <button class="pill" id="animtoggle">Pause animation</button></div>`:''}
  <div class="figbox" style="margin-bottom:4px">${figure(id,SCENE[id]?'maponly':'both')}</div>
  ${attribution(id)}
  <div style="height:8px"></div>
  <div class="row wrap tight" style="justify-content:center;margin-bottom:10px">
    <span class="tag">Front</span><span class="tag" style="margin-left:auto">Back</span></div>

  ${b?`<div class="hr"></div><div class="row" style="gap:24px">

  ${artBlock(id)}
  <div style="height:16px"></div>
  ${pickFor==='plan'

/* ================= wiring ================= */
function wire(){
  const b=cur();
  document.querySelectorAll('[data-step]').forEach(q=>q.onclick=()=>{const k=q.dataset.step,c=cur();if(!c)return;
    if(k==='w+')c.weight=+(c.weight+2.5).toFixed(2);
    if(k==='w-')c.weight=Math.max(0,+(c.weight-2.5).toFixed(2));
    if(k==='r+')c.reps++;if(k==='r-')c.reps=Math.max(1,c.reps-1);save();render()});
  const w=el('w'),r=el('r');
  if(w)w.onchange=e=>{cur().weight=Math.max(0,+e.target.value||0);save();render()};
  if(r)r.onchange=e=>{cur().reps=Math.max(1,parseInt(e.target.value)||1);save();render()};
  const g=el('begin');if(g)g.onclick=beginSet;
  const f=el('finish');if(f)f.onclick=finishSet;
  const sk=el('skip');if(sk)sk.onclick=stopTimer;
  const st=el('stop');if(st)st.onclick=stopTimer;
  const p=el('pause');if(p)p.onclick=pauseSession;
  const sp=el('sesspause');if(sp)sp.onclick=()=>sessionRunning()?pauseSession():resumeSession();
  const hr=el('heroresume');if(hr)hr.onclick=resumeSession;
  document.querySelectorAll('[data-go]').forEach(q=>q.onclick=()=>{S.session.idx=+q.dataset.go;stopTimer();save();render()});
  const es=el('endsess');if(es)es.onclick=()=>{
    if(S.session.blocks.length&&S.sets.some(q=>q.date===today()))S.done++;
    S.session=null;stopTimer();save();render()};
  const pk=el('parksess');if(pk)pk.onclick=parkSession;
  const am=el('addmore');if(am)am.onclick=()=>{tab='plan';plan='exercises';render()};
  const af1=el('addfirst');if(af1)af1.onclick=()=>{tab='plan';plan='exercises';render()};
  const ac=el('acont');if(ac)ac.onclick=resumeParked;
  const ap=el('aplan');if(ap)ap.onclick=()=>{tab='plan';plan='workouts';render()};
  const afr=el('afree');if(afr)afr.onclick=startFreestyle;
  const an=el('anew');if(an)an.onclick=()=>{S.draft=newDraft();bDay=0;tab='build';render()};
  const np=el('newplanbtn');if(np)np.onclick=()=>{S.draft=newDraft();bDay=0;tab='build';render()};
  const dp=el('dropparked');if(dp)dp.onclick=()=>{S.parked=null;save();render()};

  /* builder */
  const bn=el('bname');if(bn)bn.oninput=e=>{S.draft.n=e.target.value};
  const bdn=el('bdayname');if(bdn)bdn.oninput=e=>{S.draft.cycle[bDay].n=e.target.value};
  document.querySelectorAll('[data-bday]').forEach(q=>q.onclick=()=>{bDay=+q.dataset.bday;render()});
  document.querySelectorAll('[data-bwk]').forEach(q=>q.onclick=()=>{const d=S.draft;
    d.weeks=Math.max(1,Math.min(12,d.weeks+(q.dataset.bwk==='+'?1:-1)));
    while(d.prog.length<d.weeks)d.prog.push(d.prog[d.prog.length-1]||3);save();render()});
  document.querySelectorAll('[data-bprog]').forEach(q=>q.onclick=()=>{const d=S.draft,up=q.dataset.bprog==='+';
    d.prog=d.prog.map(v=>Math.max(1,Math.min(6,v+(up?1:-1))));save();render()});
  const ba=el('badd');if(ba)ba.onclick=()=>{pickFor='plan';plan='exercises';tab='plan';render()};
  const bc=el('bcancel');if(bc)bc.onclick=()=>{S.draft=null;tab='plan';plan='workouts';render()};
  const bs=el('bsave');if(bs)bs.onclick=savePlan;
  document.querySelectorAll('[data-brm]').forEach(q=>q.onclick=()=>{
    S.draft.cycle[bDay].b.splice(+q.dataset.brm,1);save();render()});
  document.querySelectorAll('[data-bup]').forEach(q=>q.onclick=()=>{const i=+q.dataset.bup,b=S.draft.cycle[bDay].b;
    if(!i)return;[b[i-1],b[i]]=[b[i],b[i-1]];save();render()});
  document.querySelectorAll('[data-bdown]').forEach(q=>q.onclick=()=>{const i=+q.dataset.bdown,b=S.draft.cycle[bDay].b;
    if(i>=b.length-1)return;[b[i+1],b[i]]=[b[i],b[i+1]];save();render()});
  document.querySelectorAll('[data-bset]').forEach(q=>q.onclick=()=>{const v=q.dataset.bset,i=+v.slice(1);
    const r=S.draft.cycle[bDay].b[i],up=v[0]==='+';
    r.sets=r.sets?Math.max(0,r.sets+(up?1:-1)):(up?Math.max(...S.draft.prog)+1:Math.max(...S.draft.prog)-1);
    if(r.sets<1)r.sets=null;if(r.sets>8)r.sets=8;save();render()});
  document.querySelectorAll('[data-blo]').forEach(q=>q.onclick=()=>{const v=q.dataset.blo,i=+v.slice(1);
    const r=S.draft.cycle[bDay].b[i],st=r.hi>30?5:1;
    r.reps=Math.max(1,r.reps+(v[0]==='+'?st:-st));if(r.hi<r.reps)r.hi=r.reps;save();render()});
  document.querySelectorAll('[data-bhi]').forEach(q=>q.onclick=()=>{const v=q.dataset.bhi,i=+v.slice(1);
    const r=S.draft.cycle[bDay].b[i];
    r.hi=Math.max(r.reps,r.hi+(v[0]==='+'?1:-1));save();render()});
  document.querySelectorAll('[data-toplan]').forEach(q=>q.onclick=()=>{
    const id=q.dataset.toplan,x=byId(id);
    const iso=x.rep&&x.rep.includes('s');
    const lo=iso?45:parseInt(x.rep)||10, hi=iso?45:(parseInt((x.rep.split('\u2013')[1]||''))||lo+2);
    S.draft.cycle[bDay].b.push(blk(id,lo,hi));
    save();closeSheet();tab='build';render()});
  document.querySelectorAll('[data-delplan]').forEach(q=>q.onclick=()=>{
    S.plans=S.plans.filter(x=>x.id!==q.dataset.delplan);
    if(S.current===q.dataset.delplan)S.current=(S.plans[0]||{}).id||null;save();render()});
  document.querySelectorAll('[data-usewk]').forEach(q=>q.onclick=()=>{S.current=q.dataset.usewk;save();render()});
  document.querySelectorAll('[data-startday]').forEach(q=>q.onclick=()=>{
    const [id,i]=q.dataset.startday.split(':');const p=findWk(id);if(p)startPlanDay(p,+i)});
  document.querySelectorAll('[data-editplan]').forEach(q=>q.onclick=()=>{
    const p=findWk(q.dataset.editplan);
    S.draft=JSON.parse(JSON.stringify(p));bDay=0;closeSheet();tab='build';render()});
  const sp2=el('seedplan');if(sp2)sp2.onclick=()=>{
    const p=seedPlan();S.plans=(S.plans||[]);S.plans.unshift(p);S.current=p.id;save();render()};
  const ao=el('artopen');if(ao)ao.onclick=()=>openSheet(artSheet());
  const aa=el('artall');if(aa)aa.onclick=()=>{fetchAllArt();openSheet(artSheet())};
  const acl=el('artclear');if(acl)acl.onclick=()=>{S.art={};artLog=null;save();openSheet(artSheet())};
  document.querySelectorAll('[data-artget]').forEach(q=>q.onclick=async()=>{
    const id=q.dataset.artget;q.textContent='Looking…';
    const res=await fetchArtFor(id);
    if(res==='ok'){openSheet(exSheet(id));return}
    q.textContent=res==='none'?'No image found':'Request blocked';
    setTimeout(()=>{q.textContent='Find on wger'},2600)});
  document.querySelectorAll('[data-artset]').forEach(q=>q.onclick=()=>{
    const id=q.dataset.artset,v=el('arturl').value.trim();
    setArt(id,v?{url:v,src:'own'}:null);openSheet(exSheet(id))});
  document.querySelectorAll('[data-artdel]').forEach(q=>q.onclick=()=>{
    setArt(q.dataset.artdel,null);openSheet(exSheet(q.dataset.artdel))});
  document.querySelectorAll('[data-exv]').forEach(q=>q.onclick=()=>{exView=q.dataset.exv;render()});
  document.querySelectorAll('[data-plan]').forEach(q=>q.onclick=()=>{plan=q.dataset.plan;render()});
  document.querySelectorAll('[data-stat]').forEach(q=>q.onclick=()=>{stat=q.dataset.stat;render()});
  document.querySelectorAll('[data-g]').forEach(q=>q.onclick=()=>{filt.g=q.dataset.g;render()});
  document.querySelectorAll('[data-eq]').forEach(q=>q.onclick=()=>{filt.eq=q.dataset.eq;render()});
  const q1=el('q');if(q1)q1.oninput=e=>{filt.q=e.target.value;const c=e.target.selectionStart;render();
    const n=el('q');if(n){n.focus();n.setSelectionRange(c,c)}};
  document.querySelectorAll('[data-ex]').forEach(q=>q.onclick=()=>openSheet(exSheet(q.dataset.ex)));
  document.querySelectorAll('[data-wk]').forEach(q=>q.onclick=()=>openSheet(wkSheet(q.dataset.wk)));
  document.querySelectorAll('[data-day]').forEach(q=>q.onclick=()=>openSheet(daySheet(q.dataset.day)));
  const ds=el('daystrip');if(ds)ds.scrollLeft=ds.scrollWidth;
  document.querySelectorAll('[data-close]').forEach(q=>q.onclick=closeSheet);
  document.querySelectorAll('[data-startwk]').forEach(q=>q.onclick=()=>startSession(q.dataset.startwk));
  document.querySelectorAll('[data-addex]').forEach(q=>q.onclick=()=>{
    const id=q.dataset.addex,x=byId(id);
    if(!S.session)S.session={wk:null,start:Date.now(),idx:0,blocks:[]};
    S.session.blocks.push({ex:id,target:3,reps:parseInt(x.rep)||10,logged:0,weight:suggest(id)});
    S.session.idx=S.session.blocks.length-1;save();closeSheet();tab='workout';render()});
  /* gear */
  document.querySelectorAll('[data-preset]').forEach(q=>q.onclick=()=>{
    const p=PRESETS[q.dataset.preset],g=G();
    g.unit=p.unit;g.bar=p.bar;g.plates=Object.assign({},p.plates);g.set=true;save();render()});
  document.querySelectorAll('[data-gbar]').forEach(q=>q.onclick=()=>{const g=G();
    g.bar=Math.max(0,+(g.bar+(q.dataset.gbar==='+'?0.5:-0.5)).toFixed(2));g.set=true;save();render()});
  document.querySelectorAll('[data-gunit]').forEach(q=>q.onclick=()=>{
    G().unit=q.dataset.gunit;G().set=true;save();render()});
  const gb=el('gbar');if(gb)gb.onchange=e=>{G().bar=Math.max(0,+e.target.value||0);G().set=true;save();render()};
  document.querySelectorAll('[data-plate]').forEach(q=>q.onclick=()=>{
    const v=q.dataset.plate,sz=v.slice(1),g=G();
    const n=(g.plates[sz]||0)+(v[0]==='+'?2:-2);
    if(n<=0)delete g.plates[sz];else g.plates[sz]=n;
    g.set=true;save();render()});
  document.querySelectorAll('[data-gdb]').forEach(q=>q.onclick=()=>{
    const v=q.dataset.gdb,k=v.slice(1),g=G(),d=v[0]==='+'?1:-1;
    const inc=k==='step'?0.5:2.5;
    g.db[k]=Math.max(0.5,+(g.db[k]+d*inc).toFixed(2));g.set=true;save();render()});
  document.querySelectorAll('[data-st]').forEach(q=>q.onclick=()=>{const g=G(),k=q.dataset.st;
    g.st[k]=g.st[k]===false;g.set=true;save();render()});
  document.querySelectorAll('[data-stpreset]').forEach(q=>q.onclick=()=>{
    const g=G(),p=ST_PRESETS[q.dataset.stpreset];
    g.st={};p.off.forEach(k=>g.st[k]=false);g.set=true;save();render()});
  const mt=el('minetoggle');if(mt)mt.onclick=()=>{filt.mine=!filt.mine;render()};
  const os2=el('opensync');if(os2)os2.onclick=()=>{syncErr=null;syncNote='';openSheet(syncSheet())};
  const readSync=()=>{const y=SY();
    ['repo','tok','path','branch'].forEach(k=>{const i=el('sy'+k);if(i)
      y[k==='tok'?'token':k]=i.value.trim()});
    y.repo=y.repo.replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'')};
  const syon=el('syon');if(syon)syon.onclick=async()=>{
    readSync();const y=SY();
    if(!y.token||!y.repo){alert('Both the repository and the token are needed.');return}
    y.on=true;syncBusy=true;syncErr=null;openSheet(syncSheet());
    await syncPull(true);
    if(!syncErr)await syncPush(false);
    if(syncErr)y.on=false;
    await save();openSheet(syncSheet())};
  const synow=el('synow');if(synow)synow.onclick=async()=>{
    readSync();openSheet(syncSheet());await syncPull(true);await syncPush(false);openSheet(syncSheet())};
  const syoff=el('syoff');if(syoff)syoff.onclick=()=>{
    const y=SY();y.on=false;save();openSheet(syncSheet())};
  const oi=el('openimp');if(oi)oi.onclick=()=>{imp=null;openSheet(importSheet())};
  const ip=el('impparse');if(ip)ip.onclick=()=>{
    const txt=el('imptext').value.trim();if(!txt){alert('Choose a file or paste the CSV first.');return}
    const {headers,rows}=parseCSV(txt);const {cols,unmatched}=detectCols(headers);
    const auto=cols.date!==undefined?detectOrder(rows,cols.date):null;
    imp={rows,cols,unmatched,text:txt,unit:(imp&&imp.unit)||'cm',wunit:(imp&&imp.wunit)||'kg',
      dorder:auto||(imp&&imp.dorder)||'dmy',ambiguous:!auto&&rows.some(r=>/^\d{1,2}[-\/.]\d{1,2}[-\/.]\d{4}/.test(String(r[cols.date]||'')))};
    openSheet(importSheet())};
  const iff=el('impfile');if(iff)iff.onchange=e=>{const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=()=>{el('imptext').value=r.result;el('impparse').click()};r.readAsText(f)};
  document.querySelectorAll('[data-iu]').forEach(q=>q.onclick=()=>{
    if(!imp)imp={rows:[],cols:{},unmatched:[],text:'',unit:'cm',wunit:'kg'};
    imp.unit=q.dataset.iu;openSheet(importSheet())});
  document.querySelectorAll('[data-iw]').forEach(q=>q.onclick=()=>{
    if(!imp)imp={rows:[],cols:{},unmatched:[],text:'',unit:'cm',wunit:'kg'};
    imp.wunit=q.dataset.iw;openSheet(importSheet())});
  document.querySelectorAll('[data-io]').forEach(q=>q.onclick=()=>{
    if(imp){imp.dorder=q.dataset.io;openSheet(importSheet())}});
  const ig=el('impgo');if(ig)ig.onclick=doImport;
  const eb=el('expbk');if(eb)eb.onclick=exportBackup;
  const ib=el('impbk');if(ib)ib.onclick=()=>el('bkfile').click();
  const bf2=el('bkfile');if(bf2)bf2.onchange=e=>{const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=()=>restoreBackup(r.result);r.readAsText(f)};
  const nc=el('newcheck');if(nc)nc.onclick=startCheck;
  const cq=el('chkquit');if(cq)cq.onclick=()=>{chk=null;closeSheet();render()};
  const readChk=()=>{const i=el('chkval');if(i)chk.vals[MEAS[chk.i][0]]=i.value.trim()};
  document.querySelectorAll('[data-chk]').forEach(q=>q.onclick=()=>{
    const i=el('chkval'),st=MEAS[chk.i][0]==='bf'?0.1:0.5;
    const base=+i.value|| +i.placeholder||0;
    i.value=(base+(q.dataset.chk==='+'?st:-st)).toFixed(1)});
  const cb=el('chkback');if(cb)cb.onclick=()=>{readChk();if(chk.i){chk.i--;openSheet(checkSheet())}};
  const cs=el('chkskip');if(cs)cs.onclick=()=>{delete chk.vals[MEAS[chk.i][0]];
    if(chk.i<MEAS.length-1){chk.i++;openSheet(checkSheet())}else saveCheck()};
  const cn=el('chknext');if(cn)cn.onclick=()=>{readChk();
    if(chk.i<MEAS.length-1){chk.i++;openSheet(checkSheet())}else saveCheck()};
  const sh=el('setht');if(sh)sh.onclick=()=>{const v=+el('ht').value;if(v)S.height=v;save();render()};
  document.querySelectorAll('[data-ht]').forEach(q=>q.onclick=()=>{const i=el('ht');
    i.value=(+i.value+(q.dataset.ht==='+'?.5:-.5)).toFixed(1)});
  document.querySelectorAll('[data-delchk]').forEach(q=>q.onclick=()=>{
    S.checks=S.checks.filter(c=>c.d!==q.dataset.delchk);save();render()});
  const lb=el('logbio');if(lb)lb.onclick=()=>{const v=+el('bw').value;if(!v)return;
    S.bio=S.bio.filter(x=>x.d!==today());S.bio.push({d:today(),v:+v.toFixed(1),ts:Date.now()});save();render()};
  document.querySelectorAll('[data-bio]').forEach(q=>q.onclick=()=>{const i=el('bw');
    i.value=(+i.value+(q.dataset.bio==='+'?.1:-.1)).toFixed(1)});
  document.querySelectorAll('[data-delbio]').forEach(q=>q.onclick=()=>{
    S.bio=S.bio.filter(x=>x.d!==q.dataset.delbio);save();render()});
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;pickFor=null;render()});

(async()=>{const saved=await store.get();
  if(saved&&Array.isArray(saved.sets))S=Object.assign(S,saved);
  if(!S.art)S.art={};
  if(!S.checks)S.checks=[];
  if(!S.del)S.del=[];
  (S.plans||[]).forEach(normBlocks);if(S.draft&&S.draft.cycle)normBlocks(S.draft);
  if(S.gear&&S.gear.st){const st=S.gear.st;
    if(st.legext===false||st.legcurl===false)st.legmachine=false;
    delete st.legext;delete st.legcurl}
  if(S.session&&!S.session.blocks)S.session=null;
  if(S.session&&S.session.accum===undefined){
    S.session.accum=(Date.now()-S.session.start)/1000;S.session.runningSince=null;paused=true}
  render();
  if(S.sync&&S.sync.on){await syncPull(true);render()}
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&S.sync&&S.sync.on&&!syncBusy)syncPull(true).then(render)});
  window.addEventListener('beforeunload',()=>{if(S.sync&&S.sync.on){clearTimeout(pushTimer);syncPush(false)}});
})();
</script>
</body>
</html>
